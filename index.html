      <div><div class="k">Pagos</div><div class="v">${l.length}</div><div class="tiny muted">${l.filter(c => c.periodo?.tipo === 'salario').length} de salario · ${l.filter(c => c.periodo?.tipo === 'comisiones').length} de comisiones</div></div></div>` : '';
    $('[data-lista]', cont).innerHTML = l.length ? `<div class="lista">${l.map(c => `<a class="item" href="${link(c)}"><div class="pago" style="flex:1"><div class="ic ${c.periodo?.tipo === 'comisiones' ? 'c' : 's'}">${c.periodo?.tipo === 'comisiones' ? '%' : 'Q'}</div><div class="grow"><div class="t">${esc(c.periodo?.nombre)}</div><div class="s">${fc(fp(c))} · ${c.adel > 0 ? `ganado ${L(c.recibido)}, menos ${L(c.adel)} en adelantos, vales y préstamos` : `deducciones ${L(c.total_deducciones)}`}</div></div><div style="text-align:right"><div class="num">${L(c.neto)}</div>${c.recibido_en ? '' : '<span class="chip warn" style="margin-top:4px">Por confirmar</span>'}</div></div></a>`).join('')}</div>`
      : '<div class="vacio">No hay pagos en ese rango.</div>';

        bTomar.onclick = async () => { const b = await reducirImagen(vid); b.vivo = true; parar(); mostrar(b); };

    <div class="tscroll"><table class="t"><thead><tr><th>Empleado</th><th class="r">Días con horario</th><th class="r">Marcó</th><th class="r">Faltas</th><th class="r">Tarde</th><th class="r">Horas extra</th><th class="r">Por revisar</th></tr></thead><tbody>
      ${filas.map(f => `<tr class="click" data-emp="${f.id}"><td><b>${esc(f.nombre)}</b>${f.sinH ? `<div class="tiny" style="color:#8A6A00">${f.sinH} días sin horario</div>` : ''}</td><td class="r">${f.conH}</td><td class="r">${f.marc}</td><td class="r">${f.faltas ? `<span class="chip red">${f.faltas}</span>` : '—'}</td><td class="r">${f.tarde ? `<span style="color:#B42318;font-weight:600">${minTxt(f.tarde)}</span><div class="tiny muted">${f.nTarde} día${f.nTarde > 1 ? 's' : ''}</div>` : '—'}</td><td class="r">${f.extra ? `<b>${N(f.extra / 60)} h</b>` : '—'}</td><td class="r">${f.pend ? `<span class="chip warn">${f.pend}</span>` : '—'}</td></tr>
        <tr class="q-det hidden" data-det="${f.id}"><td colspan="7"><table class="t"><thead><tr><th>Día</th><th>Horario</th><th>Entrada</th><th>Salida</th><th class="r">Tarde</th><th class="r">Extra</th><th class="r">Trabajado</th></tr></thead><tbody>
          ${f.ds.map(d => `<tr class="click ${d.falta ? 'q-falta' : ''}" data-dia="${d.fecha}"><td>${DIAS_LARGO[pf(d.fecha).getDay()].slice(0, 3)} ${fc(d.fecha)}</td><td class="small">${d.sin_horario ? '<span class="muted">Sin horario</span>' : horarioTxt(d)}</td><td>${d.m_entrada ? horaCorta(d.m_entrada) : d.falta ? '<span class="chip red">Falta</span>' : '—'}</td><td>${d.m_salida ? horaCorta(d.m_salida) : '—'}</td><td class="r">${+d.tarde_min ? `<span style="color:#B42318">${minTxt(d.tarde_min)}</span>` : '—'}</td><td class="r">${+d.extra_min ? minTxt(d.extra_min) : '—'}</td><td class="r small">${d.trabajado_min != null ? minTxt(d.trabajado_min) : '—'}${+d.n_pendientes ? ' <span class="chip warn" style="padding:0 6px">' + d.n_pendientes + '</span>' : ''}</td></tr>`).join('')}
        </tbody></table></td></tr>`).join('')}
    </tbody></table></div>
    <p class="small muted" style="margin-top:10px">Tolerancia de llegada tarde y mínimo para horas extra se configuran en Ajustes. Toca un empleado para ver cada día; toca un día para revisar sus marcajes.</p>`);
  $('#selq', m).onchange = e => location.hash = `#/marcajes/q/${e.target.value}`;

  $('#aplicar', m) && ($('#aplicar', m).onclick = () => {
    const h = hoja('Aplicar marcajes a la planilla', `<form style="display:grid;gap:12px"><p class="small" style="margin:0">${esc(per.nombre)}. Solo se toman los marcajes <b>aprobados</b>${tot('pend') ? ` (hay ${tot('pend')} por revisar que no se tomarán)` : ''}.</p>
      <ul class="small" style="margin:0;padding-left:18px;line-height:1.7"><li>Las <b>llegadas tarde</b> se pasan a la asistencia de cada día (se descuentan en la planilla).</li><li>Las <b>horas extra</b> se crean como solicitudes en Solicitudes para que decidan si se pagan o van a descanso.</li></ul>
      <label class="chk"><input type="checkbox" name="faltas">También marcar <b>falta</b> los días con horario y sin ningún marcaje</label>
      <p class="tiny muted" style="margin:0">Se puede volver a aplicar: actualiza las llegadas tarde y no duplica horas extra.</p>
      <div class="pie"><button class="btn pri">Aplicar</button></div></form>`);
    $('form', h.el).onsubmit = async ev => { ev.preventDefault(); const x = formData(ev.target); try { const r = await q(sb.rpc('pl_aplicar_marcajes', { p_periodo: per.id, p_faltas: !!x.faltas })); h.cerrar(); toast(`Aplicado: ${r.tardes} días con llegada tarde actualizados, ${r.horas_extra} solicitudes de horas extra${x.faltas ? `, ${r.faltas} faltas` : ''}`); vMarcajesQuincena(per.id); } catch (er) { toast(errMsg(er), true); } };
  });
}

/* ===================== HORARIOS y plantillas ===================== */
const DIAS_SEM = [[1, 'Lunes'], [2, 'Martes'], [3, 'Miércoles'], [4, 'Jueves'], [5, 'Viernes'], [6, 'Sábado'], [0, 'Domingo']];
const hCorta = t => { if (!t) return ''; const [h, mi] = String(t).split(':').map(Number); return `${((h + 11) % 12) + 1}${mi ? ':' + String(mi).padStart(2, '0') : ''}${h >= 12 ? 'p' : 'a'}`; };
async function vHorarios(perId) {
  cargando();
  const pers = await quincenasSalario();
  if (!pers.length) return shell('<div class="vacio"><b>Sin quincenas</b>Crea una planilla de salario para cargar horarios.</div>');
  const per = pers.find(p => p.id === perId) || quincenaDe(pers, iso(hoyHN())) || pers[0];
  const [emps0, hs, plants] = await Promise.all([
    q(sb.rpc('pl_lista_empleados')),
    q(sb.from('pl_horarios').select('*').gte('fecha', per.fecha_inicio).lte('fecha', per.fecha_fin)),
    q(sb.from('pl_horario_plantillas').select('*').eq('activo', true).order('nombre'))]);
  const emps = emps0.filter(e => e.activo);
  const fechas = []; for (let f = per.fecha_inicio; f <= per.fecha_fin; f = addDias(f, 1)) fechas.push(f);
  const H = {}; hs.forEach(h => H[h.empleado_id + '|' + h.fecha] = h);
  const hoy = iso(hoyHN());
  const sinH = emps.reduce((a, e) => a + fechas.filter(f => !H[e.id + '|' + f]).length, 0);
  const m = shell(`<div class="top"><div><h1>Horarios</h1><div class="muted small">Del ${fc(per.fecha_inicio)} al ${fc(per.fecha_fin)} · ${sinH ? `${sinH} días sin horario` : 'todos los días tienen horario'}</div></div>
      <div class="acc">${selectorQuincena(pers, per.id)}<button class="btn borde" id="plants">Plantillas</button><button class="btn pri" id="aplicar">Aplicar plantilla</button></div></div>
    ${tabsMarcajes('h', hoy, per.id).replace('href="#/horarios/' + per.id + '"', 'href="#/horarios/' + per.id + '" class="on"')}
    <div class="tscroll hor-wrap"><table class="t hor-t"><thead><tr><th class="hor-emp">Empleado</th>${fechas.map(f => `<th class="hor-d ${pf(f).getDay() === 0 ? 'dom' : ''} ${f === hoy ? 'hoy' : ''}">${'DLMMJVS'[pf(f).getDay()]}<br>${+f.slice(8)}</th>`).join('')}</tr></thead><tbody>
      ${emps.map(e => `<tr><td class="hor-emp"><b>${esc(corto(e.nombre))}</b><div class="tiny muted">${esc(e.cargo || '')}</div></td>${fechas.map(f => { const h = H[e.id + '|' + f]; return `<td class="hor-c ${!h ? 'vacio-h' : h.libre ? 'libre' : ''}" data-c="${e.id}|${f}">${!h ? '+' : h.libre ? 'Libre' : `${hCorta(h.entrada)}<br>${hCorta(h.salida)}`}</td>`; }).join('')}</tr>`).join('')}
    </tbody></table></div>
    <p class="small muted" style="margin-top:10px">Toca una casilla para cambiar el horario de ese día. “Aplicar plantilla” llena la quincena completa para los empleados que elijas.</p>`);
  const recargar = () => vHorarios(per.id);
  $('#selq', m).onchange = e => location.hash = `#/horarios/${e.target.value}`;
  $('#plants', m).onclick = () => gestionarPlantillas(recargar);
  $('#aplicar', m).onclick = () => {
    if (!plants.length) return gestionarPlantillas(recargar, true);
    const h = hoja('Aplicar plantilla de horario', `<form style="display:grid;gap:12px">
      <label class="f">Plantilla<select class="inp" name="pl">${plants.map(p => `<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select></label>
      <div class="row2"><label class="f">Desde<input class="inp" type="date" name="desde" value="${per.fecha_inicio}" min="${per.fecha_inicio}" max="${per.fecha_fin}" required></label><label class="f">Hasta<input class="inp" type="date" name="hasta" value="${per.fecha_fin}" min="${per.fecha_inicio}" max="${per.fecha_fin}" required></label></div>
      <div><div style="display:flex;justify-content:space-between;align-items:center"><b class="small">Empleados</b><label class="chk small"><input type="checkbox" id="todos" checked>Todos</label></div>
        <div class="hor-emps">${emps.map(e => `<label class="chk"><input type="checkbox" name="e" value="${e.id}" checked>${esc(e.nombre)}</label>`).join('')}</div></div>
      <label class="chk"><input type="checkbox" name="sobre" checked>Reemplazar los horarios que ya estén cargados</label>
      <div class="pie"><button class="btn pri">Aplicar</button></div></form>`, { ancha: true });
    const f = $('form', h.el);
    $('#todos', h.el).onchange = ev => $$('input[name=e]', f).forEach(c => c.checked = ev.target.checked);
    f.onsubmit = async ev => { ev.preventDefault(); const ids = $$('input[name=e]', f).filter(c => c.checked).map(c => c.value); if (!ids.length) return toast('Elige al menos un empleado', true);
      try { const n = await q(sb.rpc('pl_aplicar_plantilla_horario', { p_plantilla: f.pl.value, p_emps: ids, p_desde: f.desde.value, p_hasta: f.hasta.value, p_sobrescribir: f.sobre.checked })); h.cerrar(); toast(`${n} días de horario cargados`); recargar(); } catch (er) { toast(errMsg(er), true); } };
  };
  $$('[data-c]', m).forEach(td => td.onclick = () => {
    const [emp, fecha] = td.dataset.c.split('|'); const e = emps.find(x => x.id === emp); const h0 = H[td.dataset.c];
    const h = hoja(`${corto(e.nombre)} · ${DIAS_LARGO[pf(fecha).getDay()]} ${fc(fecha)}`, `<form style="display:grid;gap:12px">
      <div class="segm"><button type="button" data-v="0" class="${h0?.libre ? '' : 'on'}">Trabaja</button><button type="button" data-v="1" class="${h0?.libre ? 'on' : ''}">Libre</button></div><input type="hidden" name="libre" value="${h0?.libre ? 1 : 0}">
      <div class="row2" data-hrs><label class="f">Entrada<input class="inp" type="time" name="entrada" value="${String(h0?.entrada || '08:00').slice(0, 5)}"></label><label class="f">Salida<input class="inp" type="time" name="salida" value="${String(h0?.salida || '17:00').slice(0, 5)}"></label></div>
      <label class="f" data-hrs>Almuerzo (minutos)<input class="inp" type="number" name="alm" min="0" max="180" step="5" value="${h0?.almuerzo_min ?? 60}"></label>
      <div class="pie">${h0 ? '<button type="button" class="btn rojo" id="borrar">Quitar horario</button>' : ''}<button class="btn pri">Guardar</button></div></form>`);
    const f = $('form', h.el);
    const sync = () => $$('[data-hrs]', f).forEach(x => x.classList.toggle('hidden', f.libre.value === '1'));
    $$('.segm button', f).forEach(b => b.onclick = () => { $$('.segm button', f).forEach(x => x.classList.toggle('on', x === b)); f.libre.value = b.dataset.v; sync(); }); sync();
    f.onsubmit = async ev => { ev.preventDefault(); const lib = f.libre.value === '1';
      const row = { empleado_id: emp, fecha, libre: lib, entrada: lib ? null : f.entrada.value, salida: lib ? null : f.salida.value, almuerzo_min: lib ? 0 : (+f.alm.value || 0), plantilla_id: null, actualizado_por: S.user.id, actualizado_en: new Date().toISOString() };
      if (!lib && (!row.entrada || !row.salida)) return toast('Escribe la entrada y la salida', true);
      try { await q(sb.from('pl_horarios').upsert(row, { onConflict: 'empleado_id,fecha' })); h.cerrar(); toast('Horario guardado'); recargar(); } catch (er) { toast(errMsg(er), true); } };
    $('#borrar', h.el) && ($('#borrar', h.el).onclick = async () => { try { await q(sb.from('pl_horarios').delete().eq('id', h0.id)); h.cerrar(); toast('Horario quitado'); recargar(); } catch (er) { toast(errMsg(er), true); } });
  });
}
async function gestionarPlantillas(despues, nueva = false) {
  const plants = await q(sb.from('pl_horario_plantillas').select('*').order('nombre'));
  const resumen = p => DIAS_SEM.map(([d, n]) => { const x = p.dias?.[d]; return `${n.slice(0, 3)} ${x ? `${hCorta(x.entrada)}–${hCorta(x.salida)}` : 'libre'}`; }).join(' · ');
  const h = hoja('Plantillas de horario', `<div class="lista">${plants.map(p => `<button class="item" style="font:inherit;text-align:left;${p.activo ? '' : 'opacity:.5'}" data-p="${p.id}"><div class="grow"><div class="t">${esc(p.nombre)}${p.activo ? '' : ' (inactiva)'}</div><div class="s">${resumen(p)}</div></div></button>`).join('') || '<div class="vacio">Aún no hay plantillas.</div>'}</div>
    <div class="pie"><button class="btn pri" id="nueva">${ICON.mas}Nueva plantilla</button></div>`, { ancha: true });
  const editar = p => {
    h.cerrar();
    p = p || { nombre: '', activo: true, dias: { 1: { entrada: '08:00', salida: '17:00', almuerzo: 60 }, 2: { entrada: '08:00', salida: '17:00', almuerzo: 60 }, 3: { entrada: '08:00', salida: '17:00', almuerzo: 60 }, 4: { entrada: '08:00', salida: '17:00', almuerzo: 60 }, 5: { entrada: '08:00', salida: '17:00', almuerzo: 60 }, 6: null, 0: null } };
    const e2 = hoja(p.id ? 'Editar plantilla' : 'Nueva plantilla', `<form style="display:grid;gap:12px"><label class="f">Nombre<input class="inp" name="nombre" value="${esc(p.nombre)}" required placeholder="Ej.: Oficina L–V 8–5, sábado medio día"></label>
      <div class="tscroll"><table class="t"><thead><tr><th>Día</th><th>Trabaja</th><th>Entrada</th><th>Salida</th><th>Almuerzo (min)</th></tr></thead><tbody>
        ${DIAS_SEM.map(([d, n]) => { const x = p.dias?.[d]; return `<tr data-dia="${d}"><td><b>${n}</b></td><td><input type="checkbox" data-t ${x ? 'checked' : ''} aria-label="${n} trabaja"></td><td><input class="inp" type="time" data-e value="${x?.entrada || '08:00'}"></td><td><input class="inp" type="time" data-s value="${x?.salida || '17:00'}"></td><td><input class="inp" type="number" min="0" max="180" step="5" data-a value="${x?.almuerzo ?? 60}" style="width:90px"></td></tr>`; }).join('')}
      </tbody></table></div>
      ${p.id ? `<label class="chk"><input type="checkbox" name="activo" ${p.activo ? 'checked' : ''}>Activa</label>` : ''}
      <div class="pie"><button class="btn pri">Guardar plantilla</button></div></form>`, { ancha: true });
    const f = $('form', e2.el);
    const sync = () => $$('tr[data-dia]', f).forEach(tr => { const on = $('[data-t]', tr).checked; $$('input.inp', tr).forEach(i => i.disabled = !on); }); sync();
    $$('[data-t]', f).forEach(c => c.onchange = sync);
    f.onsubmit = async ev => { ev.preventDefault();
      const dias = {}; $$('tr[data-dia]', f).forEach(tr => { dias[tr.dataset.dia] = $('[data-t]', tr).checked ? { entrada: $('[data-e]', tr).value, salida: $('[data-s]', tr).value, almuerzo: +$('[data-a]', tr).value || 0 } : null; });
      const row = { nombre: f.nombre.value.trim(), dias, activo: p.id ? !!f.activo?.checked : true };
      try { if (p.id) await q(sb.from('pl_horario_plantillas').update(row).eq('id', p.id)); else await q(sb.from('pl_horario_plantillas').insert(row)); e2.cerrar(); toast('Plantilla guardada'); despues(); } catch (er) { toast(errMsg(er), true); } };
  };
  $$('[data-p]', h.el).forEach(b => b.onclick = () => editar(plants.find(p => p.id === b.dataset.p)));
  $('#nueva', h.el).onclick = () => editar(null);
  if (nueva) editar(null);
}

    <div class="pie"><button class="btn pri">Guardar saldo inicial</button></div></form>`);
  $('form', h.el).onsubmit = async ev => { ev.preventDefault(); const x = formData(ev.target); try { await q(sb.rpc('pl_vac_saldo_inicial', { p_emp: e.id, p_dias: +x.dias, p_corte: x.corte })); h.cerrar(); toast('Saldo inicial guardado'); despues(); } catch (er) { toast(errMsg(er), true); } };

function vacRegistrar(empId, despues) {
  const h = hoja('Registrar vacaciones', `<form><div class="row2"><label class="f">Desde<input class="inp" type="date" name="desde" required></label><label class="f">Hasta<input class="inp" type="date" name="hasta" required></label></div>
    <label class="f">Nota<input class="inp" name="nota"></label><p class="small muted" style="margin:0">Quedan aprobadas de una vez y se marcan como “V” en la asistencia de la planilla abierta.</p>
    <div class="pie"><button class="btn pri">Registrar vacaciones</button></div></form>`);
  const f = $('form', h.el);
  f.desde.onchange = () => { if (!f.hasta.value || f.hasta.value < f.desde.value) f.hasta.value = f.desde.value; f.hasta.min = f.desde.value; };
  f.onsubmit = async ev => {
    ev.preventDefault(); const x = formData(f);
    try {
      const dias = await q(sb.rpc('pl__dias_habiles', { p_desde: x.desde, p_hasta: x.hasta }));
      const v = await q(sb.from('pl_vacaciones').insert({ empleado_id: empId, tipo: 'solicitud', desde: x.desde, hasta: x.hasta, dias, estado: 'pendiente', nota: x.nota || 'Registrado por administración' }).select().single());
      await q(sb.rpc('pl_resolver_vacaciones', { p_id: v.id, p_aprobar: true }));
      h.cerrar(); toast(`Vacaciones registradas: ${dias} días`); despues();
    } catch (er) { toast(errMsg(er), true); }
  };

/* ===================== MINIMAPA (Leaflet + OpenStreetMap) ===================== */
let _leaflet = null;
function cargarLeaflet() {
  if (_leaflet) return _leaflet;
  _leaflet = new Promise((res, rej) => {
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(css);
    const js = document.createElement('script'); js.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    js.onload = () => (window.leaflet || window.L) && (window.leaflet || window.L).map ? res(window.leaflet || window.L) : rej(new Error('Leaflet no cargó'));
    js.onerror = () => { _leaflet = null; rej(new Error('Sin conexión al mapa')); };
    document.head.appendChild(js);
  });
  return _leaflet;
}
async function miniMapa(el, lat, lng, prec) {
  if (!el) return;
  const respaldo = () => { el.innerHTML = `<iframe title="Ubicación" loading="lazy" src="https://maps.google.com/maps?q=${lat},${lng}&z=17&output=embed" style="border:0;width:100%;height:100%"></iframe>`; };
  try {
    const Lf = await cargarLeaflet();
    if (!document.body.contains(el)) return;
    const mapa = Lf.map(el, { zoomControl: true, attributionControl: true, scrollWheelZoom: false }).setView([lat, lng], prec && prec > 150 ? 15 : 17);
    Lf.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(mapa);
    if (prec) Lf.circle([lat, lng], { radius: prec, color: '#1877F2', weight: 1, fillOpacity: .12 }).addTo(mapa);
    Lf.circleMarker([lat, lng], { radius: 8, color: '#fff', weight: 3, fillColor: '#1877F2', fillOpacity: 1 }).addTo(mapa);
    setTimeout(() => mapa.invalidateSize(), 120);
  } catch (_) { respaldo(); }
  const a = document.createElement('a'); a.href = `https://maps.google.com/?q=${lat},${lng}`; a.target = '_blank'; a.rel = 'noopener'; a.className = 'mk-abrir'; a.textContent = 'Abrir en Google Maps';
  el.appendChild(a);
}

/* ===================== DÉCIMO TERCER Y CUARTO MES a la fecha ===================== */
function calcDecimos(sal, ingreso, hoyS = iso(hoyHN())) {
  sal = +sal || 0; const h = pf(hoyS), y = h.getFullYear();
  const uno = (iniP, finP, pago) => { const ini = [iniP, ingreso || iniP].sort().pop(); const dias = ini > hoyS ? 0 : Math.min(360, difDias(ini, hoyS) + 1); return { ini, finP, dias, monto: Math.round(sal * dias / 360), completo: Math.round(sal * Math.min(360, difDias(ini, finP) + 1) / 360), pago }; };
  const d13 = uno(`${y}-01-01`, `${y}-12-31`, `diciembre ${y}`);
  const iniC = h.getMonth() >= 6 ? `${y}-07-01` : `${y - 1}-07-01`;
  const finC = h.getMonth() >= 6 ? `${y + 1}-06-30` : `${y}-06-30`;
  const d14 = uno(iniC, finC, `junio ${finC.slice(0, 4)}`);
  return { d13, d14, sal };
}
// Solo administración: referencia interna, no se muestra al empleado
function htmlDecimos(e) {
  if (!+e.salario_mensual) return '';
  const corte = e.fecha_baja && e.fecha_baja < iso(hoyHN()) ? e.fecha_baja : iso(hoyHN());
  const { d13, d14 } = calcDecimos(e.salario_mensual, e.fecha_ingreso, corte);
  const aHoy = corte === iso(hoyHN()) ? 'a hoy' : `al ${fc(corte)} (baja)`;
  const card = (t, d) => `<div class="dec-card"><div class="k">${t}</div><div class="v">${L(d.monto)}</div>
    <div class="tiny muted">${d.dias} días del ${fc(d.ini)} ${aHoy} · ${L(e.salario_mensual)} × ${d.dias} ÷ 360</div>
    <div class="barra" style="margin-top:8px"><i style="width:${Math.min(100, d.dias / 360 * 100)}%"></i></div>
    <div class="tiny" style="margin-top:6px">${corte !== iso(hoyHN()) ? 'Se incluye en la liquidación' : `Se paga en ${d.pago}${d.dias < 360 ? ` · estimado al pagarse: ${L(d.completo)}` : ''}`}</div></div>`;
  return `<div class="panel" style="margin-top:14px"><h3 style="margin-bottom:4px">Décimo tercer y cuarto mes ${corte === iso(hoyHN()) ? 'a la fecha' : 'a la fecha de baja'}</h3>
    <p class="tiny muted" style="margin:0 0 10px"><span class="chip warn">Solo administración</span> Acumulado proporcional sobre el salario mensual ordinario. Es una referencia que el empleado no ve; el monto final se calcula en la planilla de pago.</p>
    <div class="dec-g">${card('Aguinaldo · décimo tercer mes (ene–dic)', d13)}${card('Catorceavo · décimo cuarto mes (jul–jun)', d14)}</div></div>`;
}

        ${meses.map(mm => { const x13 = acumA('d13', mm), x14 = acumA('d14', mm); const p13 = esPago('d13', mm), p14 = esPago('d14', mm);

async function vDepreciacion(mes) {

  const ini = `${mes}-01`;
  const [emps, pagos] = await Promise.all([
    q(sb.from('pl_empleados').select('id,nombre,depreciacion_mensual,metodo_pago,activo').eq('recibe_depreciacion', true).order('nombre')),
    q(sb.from('pl_pagos_extra').select('*, pl_empleados(nombre)').eq('tipo', 'depreciacion').eq('periodo', mes).order('numero'))]);
  const meses = []; for (let i = -2; i <= 9; i++) { const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1); meses.push(iso(d).slice(0, 7)); }

  const fpago = `${mes}-${String(Math.min(30, fin)).padStart(2, '0')}`;

    <h2 style="margin:6px 0 10px">Comprobantes de <span style="text-transform:capitalize">${nombreMes(ini)}</span></h2>
    ${tablaPagosExtra(pagos)}`);
  $('#selm', m).onchange = e => location.hash = `#/depreciacion/${e.target.value}`;
  $$('[data-emp]', m).forEach(tr => tr.onclick = () => location.hash = `#/empleado/${tr.dataset.emp}`);
  enlazarPagosExtra(m);
  $('#impt', m) && ($('#impt', m).onclick = () => imprimirExtra(pagos.filter(p => !p.anulado)));
  $('#gen', m) && ($('#gen', m).onclick = async () => {
    if (!await confirmar('Generar comprobantes', `Depreciación de ${nombreMes(ini)} para ${pend.map(e => esc(corto(e.nombre))).join(', ')}. Fecha de pago: ${fc(fpago)}.`, 'Generar')) return;
    try { const r = await q(sb.rpc('pl_generar_depreciacion', { p_mes: ini })); toast(`${r.generados} comprobante(s) generados${r.omitidos?.length ? ' · Sin generar: ' + r.omitidos.join(', ') : ''}`, !!r.omitidos?.length && !r.generados); vDepreciacion(mes); } catch (er) { toast(errMsg(er), true); }
  });
}

function registrarOdometro(f, tipo, x, despues) {

}

const ESTADO_FER = { disponible: '<span class="chip ok">Disponible</span>', solicitado: '<span class="chip warn">Solicitado</span>', tomado: '<span class="chip gris">Tomado</span>', vencido: '<span class="chip red">Vencido</span>' };
function htmlFeriados(fs, propio = false) {
  if (!fs.length) return '<div class="vacio">No hay feriados autorizados por ahora</div>';
  return `<div class="tscroll"><table class="t"><tbody>${fs.map(f => `<tr><td><b>${esc(f.nombre)}</b><div class="tiny muted">Feriado del ${fl(f.fecha)}${f.vence ? ` · tomar hasta el ${fc(f.vence)}` : ''}${f.tomado_el ? ` · ${f.estado === 'tomado' ? 'tomado' : 'pedido'} para el ${fl(f.tomado_el)}` : ''}</div></td>
    <td class="r">${ESTADO_FER[f.estado] || ''}</td>${propio ? `<td class="r">${f.estado === 'disponible' ? `<button class="btn sm pri" data-fer="${f.id}" data-nom="${esc(f.nombre)}" data-vence="${f.vence || ''}">Solicitar</button>` : ''}</td>` : ''}</tr>`).join('')}</tbody></table></div>`;
}
function solicitarFeriado(id, nombre, vence) {
  const h = hoja('Tomar feriado', `<form><p class="small" style="margin:0 0 10px"><b>${esc(nombre)}</b></p>
    <label class="f">¿Qué día lo quieres tomar?<input class="inp" type="date" name="fecha" min="${addDias(iso(hoyHN()), -31)}" ${vence ? `max="${vence}"` : ''} required></label>
    <label class="f">Nota (opcional)<input class="inp" name="nota" maxlength="150"></label>
    <p class="tiny muted" style="margin:0">Es un día libre con goce de sueldo. Queda pendiente hasta que lo aprueben.</p>
    <div class="pie"><button class="btn pri">Solicitar feriado</button></div></form>`);
  $('form', h.el).onsubmit = async ev => {
    ev.preventDefault(); const x = formData(ev.target); const b = $('button.pri', ev.target); b.disabled = true;

  };
}

// Ajustes → Zonas de trabajo para el marcaje, quién trabaja en la calle y teléfonos registrados
async function gestionarZonas(cont) {
  const [zs, es] = await Promise.all([q(sb.from('pl_zonas').select('*').order('creado_en')),
    q(sb.from('pl_empleados').select('id,nombre,marca_libre,dispositivo_id,activo,tipo_vinculo,fecha_baja').eq('activo', true).order('nombre'))]);
  const emps = es.filter(e => e.tipo_vinculo !== 'colaborador' && !e.fecha_baja);
  cont.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap"><h3>Zonas de trabajo para el marcaje</h3><button class="btn sm pri" id="nzona">${ICON.mas}Agregar zona</button></div>
    <p class="small muted" style="margin:0 0 10px">Si alguien marca fuera de estas zonas, el marcaje queda <b>por revisar</b> con la alerta "fuera de zona". Los marcajes sin alertas se aprueban solos.${zs.some(z => z.activo) ? '' : ' <b>Aún no hay zonas:</b> mientras tanto no se revisa la ubicación.'}</p>
    ${zs.length ? zs.map(z => `<div class="interr" style="${z.activo ? '' : 'opacity:.55'}"><div><div class="t">${esc(z.nombre)}</div><div class="small muted">${z.lat.toFixed(6)}, ${z.lng.toFixed(6)} ${mapsLink(z.lat, z.lng)} · radio ${N(z.radio_m)} m</div></div>
      <div style="display:flex;gap:10px;align-items:center"><button class="btn sm borde" data-zdel="${z.id}">Quitar</button><label class="sw" title="Activa"><input type="checkbox" data-zact="${z.id}" ${z.activo ? 'checked' : ''} aria-label="Zona activa"><i></i></label></div></div>`).join('') : '<div class="vacio" style="padding:14px">Sin zonas</div>'}
    <h3 style="margin:18px 0 4px">Empleados</h3><p class="small muted" style="margin:0 0 8px"><b>Trabaja en la calle:</b> puede marcar en cualquier lugar sin alerta de zona. <b>Teléfono:</b> se registra con su primer marcaje; si marca desde otro teléfono queda por revisar. Si cambió de teléfono, toca "Cambiar teléfono".</p>
    <div class="tscroll"><table class="t"><tbody>${emps.map(e => `<tr><td><b>${esc(e.nombre)}</b><div class="tiny muted">${e.dispositivo_id ? 'Teléfono registrado' : 'Sin teléfono registrado'}</div></td>
      <td class="r"><label class="chk" style="justify-content:flex-end"><input type="checkbox" data-libre="${e.id}" ${e.marca_libre ? 'checked' : ''}>Trabaja en la calle</label></td>
      <td class="r">${e.dispositivo_id ? `<button class="btn sm borde" data-rdisp="${e.id}">Cambiar teléfono</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
  const recargar = () => gestionarZonas(cont);
  $('#nzona', cont).onclick = () => {
    const h = hoja('Agregar zona de trabajo', `<form style="display:grid;gap:12px"><label class="f">Nombre<input class="inp" name="nombre" required maxlength="60" placeholder="Ej.: Oficina principal"></label>
      <label class="f">Coordenadas (latitud, longitud)<input class="inp" name="coord" required placeholder="Ej.: 15.5042, -88.0251" inputmode="decimal"></label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button type="button" class="btn sm borde" id="miubi">Usar mi ubicación actual</button><span class="tiny muted" id="ubimsg">En Google Maps: mantén presionado el punto y copia los números.</span></div>
      <label class="f">Radio permitido (metros)<input class="inp" type="number" name="radio" min="20" max="5000" step="10" value="100" required></label>
      <div class="mk-mapa hidden" data-mapa style="height:180px"></div>
      <div class="pie"><button class="btn pri">Guardar zona</button></div></form>`);
    const f = $('form', h.el); let mapa = $('[data-mapa]', h.el);
    const leer = () => { const m2 = String(f.coord.value).match(/(-?\d+(?:\.\d+)?)\s*[,; ]\s*(-?\d+(?:\.\d+)?)/); return m2 ? { lat: +m2[1], lng: +m2[2] } : null; };
    const ver = () => { const c = leer(); if (c && Math.abs(c.lat) <= 90 && Math.abs(c.lng) <= 180) { const nuevo = mapa.cloneNode(false); nuevo.classList.remove('hidden'); mapa.replaceWith(nuevo); mapa = nuevo; miniMapa(mapa, c.lat, c.lng, +f.radio.value || 100); } };
    f.coord.onchange = ver; f.radio.onchange = ver;
    $('#miubi', h.el).onclick = async () => { $('#ubimsg', h.el).textContent = 'Obteniendo ubicación…'; try { const g = await obtenerGPS(); f.coord.value = `${g.lat.toFixed(6)}, ${g.lng.toFixed(6)}`; $('#ubimsg', h.el).textContent = `Listo (precisión ±${Math.round(g.prec)} m)`; ver(); } catch (er) { $('#ubimsg', h.el).textContent = errMsg(er); } };
    f.onsubmit = async ev => {
      ev.preventDefault(); const c = leer(); if (!c || Math.abs(c.lat) > 90 || Math.abs(c.lng) > 180) return toast('Escribe las coordenadas como: 15.5042, -88.0251', true);
      try { await q(sb.from('pl_zonas').insert({ nombre: f.nombre.value.trim(), lat: c.lat, lng: c.lng, radio_m: Math.round(+f.radio.value) })); h.cerrar(); toast('Zona guardada'); recargar(); } catch (er) { toast(errMsg(er), true); }
    };
  };
  $$('[data-zact]', cont).forEach(ch => ch.onchange = async () => { try { await q(sb.from('pl_zonas').update({ activo: ch.checked }).eq('id', ch.dataset.zact)); toast(ch.checked ? 'Zona activada' : 'Zona desactivada'); recargar(); } catch (er) { ch.checked = !ch.checked; toast(errMsg(er), true); } });
  $$('[data-zdel]', cont).forEach(b => b.onclick = async () => { if (!await confirmar('Quitar zona', 'Los marcajes que ya se hicieron no cambian.', 'Quitar', true)) return; try { await q(sb.from('pl_marcajes').update({ zona_id: null }).eq('zona_id', b.dataset.zdel)).catch(() => { }); await q(sb.from('pl_zonas').delete().eq('id', b.dataset.zdel)); toast('Zona quitada'); recargar(); } catch (er) { toast('No se pudo quitar; desactívala con el interruptor', true); } });
  $$('[data-libre]', cont).forEach(ch => ch.onchange = async () => { try { await q(sb.rpc('pl_set_marca_libre', { p_emp: ch.dataset.libre, p_libre: ch.checked })); toast(ch.checked ? 'Puede marcar en cualquier lugar' : 'Debe marcar dentro de una zona'); } catch (er) { ch.checked = !ch.checked; toast(errMsg(er), true); } });
  $$('[data-rdisp]', cont).forEach(b => b.onclick = async () => { if (!await confirmar('Cambiar teléfono', 'Se quita el teléfono registrado. El próximo teléfono desde el que marque quedará registrado.', 'Cambiar')) return; try { await q(sb.rpc('pl_reiniciar_dispositivo', { p_emp: b.dataset.rdisp })); toast('Listo: se registrará su próximo teléfono'); recargar(); } catch (er) { toast(errMsg(er), true); } });
}
async function gestionarFeriados(cont) {
  const fs = await q(sb.from('pl_feriados').select('*').order('fecha', { ascending: false }));
  let usos = []; try { usos = await q(sb.from('pl_permisos').select('feriado_id,estado').not('feriado_id', 'is', null).in('estado', ['pendiente', 'aprobado'])); } catch (_) { }
  const cuenta = (id, e) => usos.filter(u => u.feriado_id === id && u.estado === e).length;
  cont.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px"><h3>Feriados para tomar</h3><button class="btn sm pri" id="nfer">${ICON.mas}Agregar feriado</button></div>

    ...he.map(h => ({ f: h.solicitado_en, t: etiquetaHoras(h), d: `${fc(h.fecha)} · ${horasTxt(h)} · ${esc(h.motivo)}`, e: h.estado, nota: h.respuesta, cancel: h.estado === 'pendiente' && ['horas', h.id], rec: h }))
  ].filter(x => x.nota !== 'Editada por el empleado').sort((a, b) => String(b.f).localeCompare(String(a.f)));
  const pend = todas.filter(x => x.e === 'pendiente').length;
  const m = shell(`<div class="top"><div><h1>Mis solicitudes</h1><div class="muted small">${pend ? `${pend} pendiente${pend > 1 ? 's' : ''} de respuesta` : 'Todo al día'}</div></div></div>

      <a class="accion" href="#/solicitar/vacaciones">${ICON.sol}<span>Vacaciones<br><small class="muted">${N(vr.disponible_pedir ?? 0)} días disponibles</small></span></a>
      <a class="accion" href="#/solicitar/permiso">${ICON.reloj}<span>Permiso</span></a>
      <a class="accion" href="#/solicitar/horas">${ICON.mas}<span>Horas extra</span></a>
      <a class="accion" href="#/solicitar/descanso">${ICON.bandeja}<span>Descanso<br><small class="muted">${N(b.disponible)} h disponibles</small></span></a>

  $$('[data-ed]', m).forEach(btn => btn.onclick = () => { const [t, id] = btn.dataset.ed.split('|'); const x = todas.find(y => y.rec?.id === id); if (x) editarSolicitud(t, x.rec, vMisSolicitudes); });

/* ===================== EDITAR / CANCELAR solicitudes pendientes ===================== */
// vacaciones y permisos se pueden pedir (o corregir) hasta 7 días hacia atrás
const DIAS_ATRAS_SOL = 7;
const minFechaSol = () => addDias(iso(hoyHN()), -DIAS_ATRAS_SOL);
const cancelarSolicitud = (t, id) => q(sb.rpc({ adelanto: 'pl_cancelar_adelanto', vac: 'pl_cancelar_vacaciones', perm: 'pl_cancelar_permiso', horas: 'pl_cancelar_horas', cons: 'pl_cancelar_constancia' }[t], { p_id: id }));
function editarSolicitud(t, r, despues) {
  const hoy = iso(hoyHN());
  const seg = (nombre, opts, val) => `<div class="segm" data-seg="${nombre}">${opts.map(([v, txt]) => `<button type="button" data-v="${v}" class="${String(v) === String(val) ? 'on' : ''}">${txt}</button>`).join('')}</div><input type="hidden" name="${nombre}" value="${val}">`;
  const campos = {
    adelanto: `<p class="small muted" style="margin:0">Adelanto de ${r.tipo === 'comisiones' ? 'comisiones' : 'salario'}.</p>
      <label class="f">Monto (L)<input class="inp" type="number" name="monto" min="1" step="1" value="${Math.round(r.monto_solicitado || r.monto)}" required inputmode="numeric"></label>
      <label class="f">Motivo (opcional)<input class="inp" name="nota" value="${esc(/^Adelanto de/.test(r.descripcion || '') ? '' : (r.descripcion || ''))}"></label>`,
    vac: `<div class="row2"><label class="f">Desde<input class="inp" type="date" name="desde" min="${minFechaSol()}" value="${r.desde}" required></label><label class="f">Hasta<input class="inp" type="date" name="hasta" min="${minFechaSol()}" value="${r.hasta}" required></label></div>
      <label class="f">Comentario (opcional)<input class="inp" name="nota" value="${esc(r.nota || '')}"></label>`,

/* ===================== PLANTILLAS DE CÁLCULO ===================== */
const CALCULOS = { porcentaje: 'Porcentaje de un monto', unitario: 'Cantidad × valor por unidad', fijo: 'Monto fijo que se escribe' };
function reglaPlantilla(p) {
  const f = +p.factor !== 100 ? ` × ${N(p.factor)}%` : '';
  return p.calculo === 'porcentaje' ? `${N(p.valor)}% del monto${f}` : p.calculo === 'unitario' ? `L ${N(p.valor)} c/u${f}` : 'monto que se escribe';
}
function calcPlantilla(p, cantidad) {
  const c = +cantidad || 0; const f = (+p.factor || 100) / 100;
  if (p.calculo === 'porcentaje') return { monto: Math.round(c * (+p.valor) / 100 * f), detalle: `L ${N(c)} × ${N(p.valor)}%${+p.factor !== 100 ? ` × ${N(p.factor)}%` : ''}` };
  if (p.calculo === 'unitario') return { monto: Math.round(c * (+p.valor) * f), detalle: `${N(c)} × L ${N(p.valor)}${+p.factor !== 100 ? ` × ${N(p.factor)}%` : ''}` };
  return { monto: Math.round(c), detalle: null };
}
const areaDe = e => String(e.area || e.cargo || '').trim().toLowerCase();
function plantillasDe(e, aplica, todas) {
  const propias = todas.filter(p => p.activo && p.aplica === aplica && p.empleado_id === e.id);
  const deArea = todas.filter(p => p.activo && p.aplica === aplica && !p.empleado_id && p.area && p.area.trim().toLowerCase() === areaDe(e) && !propias.some(x => x.concepto === p.concepto && x.tipo === p.tipo));
  return [...propias, ...deArea].sort((a, b) => (a.tipo === b.tipo ? 0 : a.tipo === 'ingreso' ? -1 : 1) || a.orden - b.orden);
}
async function capturarPlantillas(per) {
  const [todas, emps, movs, calc] = await Promise.all([
    q(sb.from('pl_plantillas').select('*')), q(sb.from('pl_empleados').select('id,nombre,area,cargo,activo,recibe_salario,recibe_comisiones').order('nombre')),
    q(sb.from('pl_movimientos').select('*').eq('periodo_id', per.id)), q(sb.rpc('pl_calcular', { p_periodo: per.id }))]);
  const enPer = new Set(calc.map(c => c.empleado_id));
  const lista = emps.map(e => ({ e, ps: plantillasDe(e, per.tipo, todas) }))
    .filter(({ e, ps }) => ps.length && e.activo && (enPer.has(e.id) || (per.tipo === 'comisiones' ? e.recibe_comisiones : e.recibe_salario)));
  const sinPl = emps.filter(e => enPer.has(e.id) && !lista.some(x => x.e.id === e.id));
  const existente = (e, p) => movs.find(mv => mv.empleado_id === e.id && (mv.plantilla_id === p.id || (mv.concepto === p.concepto && mv.tipo === p.tipo)));
  const h = hoja(`Capturar ${per.tipo === 'comisiones' ? 'comisiones' : 'líneas'} · ${per.nombre}`, `
    ${lista.length ? `<p class="small muted" style="margin:0 0 12px">Escribe solo las cantidades (intereses cobrados, cuentas canceladas, traslados…). El cálculo de cada empleado ya está configurado. Deja vacío lo que no aplica.</p>
    <input class="inp" id="buscar" placeholder="Buscar empleado" style="margin-bottom:12px">
    <form id="fcap"><div class="lista">${lista.map(({ e, ps }) => `<div class="panel" data-emp="${e.id}" data-nom="${esc(e.nombre.toLowerCase())}"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px"><h3>${esc(e.nombre)}</h3><span class="num" data-tot>—</span></div>
      <table class="t"><tbody>${ps.map(p => { const mv = existente(e, p); const val = mv ? (mv.cantidad ?? (p.calculo === 'fijo' ? mv.monto : '')) : ''; return `<tr><td><span class="chip ${p.tipo === 'ingreso' ? 'ok' : 'red'}" style="padding:0 7px">${p.tipo === 'ingreso' ? '+' : '−'}</span> ${esc(p.concepto)}<div class="tiny muted">${reglaPlantilla(p)}${p.empleado_id ? '' : ' · plantilla del área'}</div></td>
        <td style="width:190px"><input class="inp" type="number" step="any" min="0" inputmode="decimal" data-p="${p.id}" data-e="${e.id}" value="${val ?? ''}" placeholder="${esc(p.etiqueta || (p.calculo === 'fijo' ? 'Monto (L)' : 'Cantidad'))}" title="${esc(p.etiqueta || '')}"></td>
        <td class="r num" style="width:110px" data-m="${p.id}|${e.id}">—</td></tr>`; }).join('')}</tbody></table></div>`).join('')}</div>
      ${sinPl.length ? `<p class="small muted">Sin plantilla: ${sinPl.map(e => esc(corto(e.nombre))).join(', ')}. Configúrala en la ficha del empleado o por área en Ajustes.</p>` : ''}
      <div class="pie" style="position:sticky;bottom:0;background:#fff;padding-top:10px"><span class="small muted" id="resumen" style="margin-right:auto;align-self:center"></span><button class="btn pri">Guardar captura</button></div></form>`
    : '<div class="vacio"><b>No hay plantillas para este tipo de planilla</b>Configura el cálculo de cada empleado en su ficha (sección Plantillas de cálculo) o por área en Ajustes.</div>'}`, { ancha: true });
  const f = $('#fcap', h.el); if (!f) return;
  const pl = id => todas.find(p => p.id === id);
  const recalcular = () => {
    let total = 0;
    $$('[data-emp]', h.el).forEach(box => {
      let t = 0;
      $$('input[data-p]', box).forEach(inp => { const p = pl(inp.dataset.p); const r = inp.value === '' ? null : calcPlantilla(p, inp.value); const cel = $(`[data-m="${inp.dataset.p}|${inp.dataset.e}"]`, box); cel.textContent = r ? L(r.monto) : '—'; if (r) t += p.tipo === 'ingreso' ? r.monto : -r.monto; });
      $('[data-tot]', box).textContent = L(t); total += t;
    });
    $('#resumen', h.el).textContent = `Neto capturado: ${L(total)}`;
  };
  f.addEventListener('input', recalcular); recalcular();
  $('#buscar', h.el).oninput = ev => { const t = ev.target.value.trim().toLowerCase(); $$('[data-emp]', h.el).forEach(b => b.hidden = t && !b.dataset.nom.includes(t)); };
  f.onsubmit = async ev => {
    ev.preventDefault(); const btn = $('button.pri', f); btn.disabled = true; let n = 0;
    try {
      for (const inp of $$('input[data-p]', f)) {
        const p = pl(inp.dataset.p); const e = { id: inp.dataset.e }; const mv = existente(e, p);
        if (inp.value === '' || +inp.value === 0) { if (mv && mv.plantilla_id === p.id) { await q(sb.from('pl_movimientos').delete().eq('id', mv.id)); n++; } continue; }
        const r = calcPlantilla(p, inp.value);
        const row = { monto: r.monto, detalle: r.detalle, cantidad: +inp.value, plantilla_id: p.id, concepto: p.concepto, tipo: p.tipo, orden: p.orden };
        if (mv) { if (+mv.monto !== r.monto || +mv.cantidad !== +inp.value || mv.plantilla_id !== p.id) { await q(sb.from('pl_movimientos').update(row).eq('id', mv.id)); n++; } }
        else { await q(sb.from('pl_movimientos').insert({ ...row, periodo_id: per.id, empleado_id: e.id })); n++; }
      }
      h.cerrar(); toast(n ? `Captura guardada (${n} líneas)` : 'Sin cambios'); vPeriodo(per.id, 'movimientos');
    } catch (er) { btn.disabled = false; toast(errMsg(er), true); }
  };
}

/* ===================== HISTORIAL DE SOLICITUDES: pestañas + calendario ===================== */
const horaCorta = t => { if (!t) return ''; const [h, m] = String(t).split(':').map(Number); const ap = h >= 12 ? 'p. m.' : 'a. m.'; return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${ap}`; };
// minutos dentro de la hora de almuerzo (Ajustes: almuerzo_inicio / almuerzo_fin, por defecto 12:00 a 1:00 p. m.); no cuentan como hora extra
const aMin = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + (m || 0); };
const almuerzoMin = (ini, fin) => {
  const a = aMin(S.par?.almuerzo_inicio || '12:00'), b = aMin(S.par?.almuerzo_fin || '13:00'); if (b <= a || !ini || !fin || ini === fin) return 0;
  const i = aMin(ini), f = aMin(fin), sol = (x, y) => Math.max(0, Math.min(y, b) - Math.max(x, a));
  return f > i ? sol(i, f) : sol(i, 1440) + sol(0, f);
};
const calcHoras = (ini, fin) => { if (!ini || !fin || ini === fin) return 0; let d = aMin(fin) - aMin(ini); if (d <= 0) d += 1440; d -= almuerzoMin(ini, fin); return Math.max(0, Math.round(d / 60 * 100) / 100); };
function vincularRango(f) {
  const upd = () => { const n = calcHoras(f.inicio.value, f.fin.value); const el = $('[data-tot]', f); if (el) el.innerHTML = n ? `Total: <b>${N(n)} horas</b>${almuerzoMin(f.inicio.value, f.fin.value) ? ' (sin la hora de almuerzo)' : ''}${f.fin.value <= f.inicio.value ? ' (termina al día siguiente)' : ''}` : 'Escribe la hora en que empezaste y terminaste.'; };
  f.inicio.addEventListener('input', upd); f.fin.addEventListener('input', upd); upd();
}
const horasTxt = h => h.hora_inicio ? `${horaCorta(h.hora_inicio)} – ${horaCorta(h.hora_fin)} (${N(h.horas)} h)` : `${N(h.horas)} h`;
const HIST_TABS = [
  ['horas', 'Horas extra', 'pl_horas_extra'], ['permisos', 'Permisos', 'pl_permisos'], ['vacaciones', 'Vacaciones', 'pl_vacaciones'],
  ['adelantos', 'Adelantos', 'pl_adelantos'], ['constancias', 'Constancias', 'pl_constancia_solicitudes']];
const estadoClase = e => /^rechazad/.test(e) ? 'rech' : /^cancelad/.test(e) ? 'canc' : e === 'pendiente' ? 'pend' : 'ok';
async function historialSolicitudes(cont, { sup }) {
  const tabs = sup ? HIST_TABS.slice(0, 3) : HIST_TABS;
  let st = { tab: 'horas', mes: iso(hoyHN()).slice(0, 7), dia: null };
  try { st = { ...st, ...(JSON.parse(sessionStorage.getItem('pl_hist_sol')) || {}), dia: null }; } catch (_) { }
  if (!tabs.some(t => t[0] === st.tab)) st.tab = 'horas';
  let nombres = null;
  const cargar = async () => {
    try { sessionStorage.setItem('pl_hist_sol', JSON.stringify(st)); } catch (_) { }
    cont.innerHTML = '<div class="cargando">Cargando…</div>';
    const ini = `${st.mes}-01`, fin = iso(new Date(+st.mes.slice(0, 4), +st.mes.slice(5, 7), 0));
    const sel = sup ? '*' : '*, pl_empleados(nombre)';
    let qy;
    if (st.tab === 'horas') qy = sb.from('pl_horas_extra').select(sel).gte('fecha', ini).lte('fecha', fin);
    else if (st.tab === 'permisos') qy = sb.from('pl_permisos').select(sel).lte('desde', fin).gte('hasta', ini);
    else if (st.tab === 'vacaciones') qy = sb.from('pl_vacaciones').select(sel).eq('tipo', 'solicitud').lte('desde', fin).gte('hasta', ini);
    else if (st.tab === 'adelantos') qy = sb.from('pl_adelantos').select(sel).gte('fecha', ini).lte('fecha', fin);
    else qy = sb.from('pl_constancia_solicitudes').select(sel).gte('solicitado_en', ini + 'T00:00:00-06:00').lte('solicitado_en', fin + 'T23:59:59-06:00');
    let rows = [];
    try { rows = (await q(qy.limit(500))).filter(x => x.respuesta !== 'Editada por el empleado'); } catch (er) { cont.innerHTML = `<div class="vacio">${esc(errMsg(er))}</div>`; return; }
    if (sup) { if (!nombres) { try { nombres = await q(sb.rpc('pl_nombres_empleados')); } catch (_) { nombres = []; } } rows.forEach(x => x.pl_empleados = { nombre: nombres.find(n => n.id === x.empleado_id)?.nombre || '' }); }
    const uids = [...new Set(rows.flatMap(x => [x.creado_por, x.solicitado_por, x.resuelto_por, x.desembolsado_por]).filter(Boolean))];
    let us = []; try { us = uids.length ? await q(sb.rpc('pl_nombres_usuarios', { p_ids: uids })) : []; } catch (_) { }
    const nomU = id => { const u = us.find(x => x.id === id); return u ? corto(u.nombre) : null; };
    // fechas que ocupa cada registro dentro del mes
    const fechasDe = x => {
      if (st.tab === 'horas' || st.tab === 'adelantos') return [x.fecha];
      if (st.tab === 'constancias') return [new Date(x.solicitado_en).toLocaleDateString('en-CA', { timeZone: 'America/Tegucigalpa' })];
      const out = []; for (let d = (x.desde < ini ? ini : x.desde); d <= (x.hasta || x.desde) && d <= fin; d = addDias(d, 1)) out.push(d); return out;
    };
    const porDia = {}; rows.forEach(x => fechasDe(x).forEach(d => (porDia[d] = porDia[d] || []).push(x)));
    const desc = x => st.tab === 'horas' ? `${x.tipo === 'descanso' ? 'Descanso compensatorio' : 'Horas extra'} · ${fc(x.fecha)} · ${horasTxt(x)}${x.tipo === 'extra' && x.estado === 'aprobada' ? ` · ${x.destino === 'pagar' ? 'se pagan' : 'a descanso'}` : x.preferencia ? ` · prefiere ${x.preferencia === 'pagar' ? 'pago' : 'descanso'}` : ''}${x.motivo ? ' · ' + esc(x.motivo) : ''}`
      : st.tab === 'permisos' ? `${tipoPermiso(x)} · ${rangoPermiso(x)} · ${esc(x.motivo || '')}`
      : st.tab === 'vacaciones' ? `${fc(x.desde)} al ${fc(x.hasta)} · ${N(x.dias)} días${x.nota ? ' · ' + esc(x.nota) : ''}`
      : st.tab === 'adelantos' ? `${x.tipo === 'comisiones' ? 'De comisiones' : 'De salario'} · ${fc(x.fecha)} · <b>${L(x.monto)}</b>${x.automatico ? ' · automático' : ''}${x.origen === 'admin' ? ' · registrado por administración' : ''}${x.estado === 'aprobado' ? (x.desembolsado_en ? ` · <span style="color:#0F7A43;font-weight:600">entregado ${fdt(x.desembolsado_en)}${x.desembolso_metodo && !/registr/i.test(x.desembolso_metodo) ? ' (' + esc(x.desembolso_metodo) + ')' : ''}${x.desembolsado_por ? ' por ' + esc(nomU(x.desembolsado_por) || '') : ''}</span>` : ' · <span style="color:#8A6A00;font-weight:600">por entregar</span>') : ''}`
      : `Dirigida a ${esc(x.dirigido_a || 'A quien interese')}${x.motivo ? ' · ' + esc(x.motivo) : ''}`;
    const resTxt = x => {
      if (x.estado === 'pendiente') return 'Pendiente de respuesta';
      if (/^cancelad/.test(x.estado)) return `Cancelada${x.resuelto_en ? ' ' + fdt(x.resuelto_en) : ''}${x.resuelto_por && x.resuelto_por !== (x.solicitado_por || x.creado_por) ? ` por ${esc(nomU(x.resuelto_por) || '')}` : ' por el empleado'}`;
      if (x.automatico && !x.resuelto_por) return `Aprobado automáticamente${x.resuelto_en ? ' ' + fdt(x.resuelto_en) : ''}`;
      const v = { aprobado: 'Aprobado', aprobada: 'Aprobada', rechazado: 'Rechazado', rechazada: 'Rechazada', emitida: 'Emitida' }[x.estado] || 'Resuelto';
      return `${v}${x.resuelto_en ? ' ' + fdt(x.resuelto_en) : ''}${x.resuelto_por ? ` por <b>${esc(nomU(x.resuelto_por) || '')}</b>` : ''}`;
    };
    const fila = x => `<div class="hist-fila ${estadoClase(x.estado)}"><div class="grow" style="min-width:0"><div class="t"><b>${esc(x.pl_empleados?.nombre || '')}</b></div><div class="small">${desc(x)}</div>
      <div class="tiny">Registrado ${fdt(x.creado_en || x.solicitado_en)} por <b>${esc(nomU(x.creado_por || x.solicitado_por) || (x.origen === 'admin' ? 'administración' : 'el empleado'))}</b></div>

    // calendario
    const d1 = pf(ini); const offset = (d1.getDay() + 6) % 7; const nd = +fin.slice(8, 10);
    const hoy = iso(hoyHN());
    const celdas = []; for (let k = 0; k < offset; k++) celdas.push('<div></div>');
    for (let dd = 1; dd <= nd; dd++) {
      const f = `${st.mes}-${String(dd).padStart(2, '0')}`; const l = porDia[f] || [];
      const cnt = c => l.filter(x => estadoClase(x.estado) === c).length;
      celdas.push(`<button type="button" class="cal-d ${f === st.dia ? 'sel' : ''} ${f === hoy ? 'hoy' : ''} ${l.length ? 'con' : ''}" data-f="${f}"><span>${dd}</span>${l.length ? `<i>${['ok', 'pend', 'rech', 'canc'].map(c => cnt(c) ? `<b class="pt ${c}">${cnt(c) > 1 ? cnt(c) : ''}</b>` : '').join('')}</i>` : ''}</button>`);
    }
    const lista = st.dia ? (porDia[st.dia] || []) : rows;
    const ordenada = [...lista].sort((a, b) => String((b.fecha || b.desde || b.solicitado_en)).localeCompare(String(a.fecha || a.desde || a.solicitado_en)) || String(b.creado_en || b.solicitado_en).localeCompare(String(a.creado_en || a.solicitado_en)));
    const nomMes = `${MESES[d1.getMonth()][0].toUpperCase()}${MESES[d1.getMonth()].slice(1)} ${d1.getFullYear()}`;
    const tot = c => rows.filter(x => estadoClase(x.estado) === c).length;
    cont.innerHTML = `<div class="tabs" style="margin-bottom:12px">${tabs.map(([k, t]) => `<a href="#" data-tab="${k}" class="${k === st.tab ? 'on' : ''}">${t}</a>`).join('')}</div>
      <div class="hist-wrap"><div class="panel cal">
        <div class="cal-top"><button class="btn sm borde" data-m="-1" aria-label="Mes anterior">‹</button><b>${nomMes}</b><button class="btn sm borde" data-m="1" aria-label="Mes siguiente">›</button></div>
        <div class="cal-g">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(x => `<div class="cal-h">${x}</div>`).join('')}${celdas.join('')}</div>
        <div class="cal-ley"><span><b class="pt ok"></b>Aprobadas ${tot('ok')}</span><span><b class="pt pend"></b>Pendientes ${tot('pend')}</span><span><b class="pt rech"></b>Rechazadas ${tot('rech')}</span><span><b class="pt canc"></b>Canceladas ${tot('canc')}</span></div></div>
        <div style="min-width:0"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap"><h3 style="margin:0">${st.dia ? `${DIAS_LARGO[pf(st.dia).getDay()]} ${fl(st.dia)}` : `Todo ${nomMes.toLowerCase()}`} · ${ordenada.length}</h3>${st.dia ? '<button class="btn sm borde" data-todo>Ver todo el mes</button>' : ''}</div>
        ${ordenada.length ? `<div class="hist-lista">${ordenada.map(fila).join('')}</div>` : `<div class="vacio">Sin registros ${st.dia ? 'este día' : 'este mes'}.</div>`}</div></div>`;
    $$('[data-tab]', cont).forEach(a => a.onclick = e => { e.preventDefault(); st.tab = a.dataset.tab; st.dia = null; cargar(); });
    $$('[data-m]', cont).forEach(b => b.onclick = () => { const d = pf(ini); d.setMonth(d.getMonth() + +b.dataset.m); st.mes = iso(d).slice(0, 7); st.dia = null; cargar(); });
    $$('[data-f]', cont).forEach(b => b.onclick = () => { st.dia = st.dia === b.dataset.f ? null : b.dataset.f; cargar(); });
    $('[data-todo]', cont) && ($('[data-todo]', cont).onclick = () => { st.dia = null; cargar(); });
  };
  cargar();
}

async function vCombustible(perId) {

  const [rows, emps, par] = await Promise.all([
    q(sb.from('pl_odometro').select('*').gte('fecha', rg.desde).lte('fecha', rg.hasta).order('fecha')),

    ${ids.length ? ids.map(id => { const e = emps.find(x => x.id === id); const d = porEmp(id); const km = Object.values(d).reduce((a, x) => a + (x.inicio && x.fin ? +x.fin.lectura - +x.inicio.lectura : 0), 0);
      const fechas = []; for (let f = rg.desde; f <= rg.hasta; f = addDias(f, 1)) if (d[f] || pf(f).getDay() !== 0) fechas.push(f);

    const [emp, fecha, tipo] = b.dataset.add.split('|');
    const h = hoja('Agregar lectura', `<form><p class="small muted" style="margin:0">${tipo === 'inicio' ? 'Inicio' : 'Fin'} del ${fc(fecha)}. Queda marcada como agregada por administración (sin GPS).</p>

/* ===================== ADMIN: historial ===================== */
const TABLAS = { pl_empleados: 'Empleado', pl_periodos: 'Planilla', pl_asistencia: 'Asistencia', pl_adelantos: 'Adelanto', pl_prestamos: 'Préstamo', pl_prestamo_pagos: 'Abono a préstamo', pl_movimientos: 'Línea de planilla', pl_comprobantes: 'Comprobante', pl_vacaciones: 'Vacaciones', pl_odometro: 'Odómetro', pl_parametros: 'Ajuste', pl_admins: 'Administrador', pl_conceptos: 'Concepto', pl_supervisores: 'Supervisor', pl_plantillas: 'Plantilla de cálculo', pl_permisos: 'Permiso', pl_horas_extra: 'Horas extra', pl_constancias: 'Constancia', pl_marcajes: 'Marcaje', pl_horarios: 'Horario', pl_horario_plantillas: 'Plantilla de horario', pl_pagos_extra: 'Pago de combustible/depreciación', pl_constancia_solicitudes: 'Solicitud de constancia' };
const OMITIR = ['actualizado_en', 'generado_en', 'datos', 'creado_en'];
async function vHistorial() {
  cargando();
  const filtro = sessionStorage.getItem('pl_hist_f') || '';
  let qy = sb.from('pl_auditoria').select('*').order('fecha', { ascending: false }).limit(300);
  if (filtro) qy = qy.eq('tabla', filtro);
  const [rows, emps, pers] = await Promise.all([q(qy), q(sb.from('pl_empleados').select('id,nombre,user_id')), q(sb.from('pl_periodos').select('id,nombre'))]);
  const nomE = id => emps.find(e => e.id === id || e.user_id === id)?.nombre;
  const nomP = id => pers.find(p => p.id === id)?.nombre;
  const desc = r => { const x = r.despues || r.antes || {}; const partes = [x.nombre || nomE(x.empleado_id) || nomE(x.user_id), x.concepto, x.codigo, x.numero, x.clave, x.fecha && r.tabla !== 'pl_empleados' ? fc(x.fecha) : null, x.periodo_id ? nomP(x.periodo_id) : null]; return partes.filter(Boolean).map(esc).join(' · '); };
  const val = v => v === null || v === undefined ? '∅' : typeof v === 'object' ? JSON.stringify(v) : String(v);
  const cambios = r => { if (r.accion !== 'update') return ''; const a = r.antes || {}, d = r.despues || {}; return Object.keys(d).filter(k => !OMITIR.includes(k) && JSON.stringify(a[k]) !== JSON.stringify(d[k])).map(k => `<div class="tiny"><b>${esc(k.replace(/_/g, ' '))}</b>: <span style="color:var(--rojo);text-decoration:line-through">${esc(val(a[k]))}</span> → <span style="color:var(--verde)">${esc(val(d[k]))}</span></div>`).join(''); };
  const acc = { insert: '<span class="chip ok">Creó</span>', update: '<span class="chip">Cambió</span>', delete: '<span class="chip red">Eliminó</span>' };
  const m = shell(`<div class="top"><div><h1>Historial de cambios</h1><div class="muted small">Quién cambió qué y cuándo · últimos 300 movimientos</div></div>
      <div class="acc"><select class="inp" id="ft" style="width:auto"><option value="">Todo</option>${Object.entries(TABLAS).map(([k, t]) => `<option value="${k}" ${k === filtro ? 'selected' : ''}>${t}</option>`).join('')}</select></div></div>
    ${rows.length ? `<div class="tscroll"><table class="t"><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Registro</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td class="small" style="white-space:nowrap">${fdt(r.fecha)}</td><td class="small">${esc(r.usuario_nombre || 'Sistema')}</td><td>${acc[r.accion] || r.accion} <span class="small muted">${TABLAS[r.tabla] || r.tabla}</span></td><td><div class="small">${desc(r)}</div>${cambios(r)}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="vacio">Sin cambios registrados todavía.</div>'}`);
  $('#ft', m).onchange = e => { try { sessionStorage.setItem('pl_hist_f', e.target.value); } catch (_) { } vHistorial(); };
}

/* ===================== BAJA DE EMPLEADO ===================== */
const BAJA_MOTIVOS = { renuncia: 'Renuncia', despido: 'Despido sin justa causa', justa: 'Despido con justa causa', mutuo: 'Mutuo acuerdo', fin_contrato: 'Fin de contrato', abandono: 'Abandono de trabajo', otro: 'Otro' };
const BAJA_LIQ = { renuncia: 'renuncia', despido: 'despido', justa: 'justa', mutuo: 'mutuo', fin_contrato: 'mutuo', abandono: 'justa', otro: 'renuncia' };
function darBaja(e, despues) {
  const h = hoja(`Dar de baja · ${corto(e.nombre)}`, `<form style="display:grid;gap:12px">
    <label class="f">Último día laborado<input class="inp" type="date" name="fecha" value="${iso(hoyHN())}" ${e.fecha_ingreso ? `min="${e.fecha_ingreso}"` : ''} required></label>
    <label class="f">Motivo<select class="inp" name="motivo" required>${Object.entries(BAJA_MOTIVOS).map(([k, t]) => `<option value="${k}">${t}</option>`).join('')}</select></label>
    <label class="f">Nota (opcional)<input class="inp" name="nota" placeholder="Ej.: entregó carta de renuncia el 25/09"></label>
    ${e.user_id ? '<label class="chk"><input type="checkbox" name="acceso">Quitarle también el acceso a la app</label><p class="tiny muted" style="margin:-6px 0 0">Si lo dejas, podrá seguir viendo sus comprobantes y su liquidación.</p>' : ''}
    <div class="panel small" style="background:#FFF6CC;border-color:#F0D36B;margin:0">Al darlo de baja:<ul style="margin:6px 0 0;padding-left:18px;line-height:1.6"><li>Queda inactivo y ya no entra en planillas que empiezan después de esa fecha.</li><li>En la planilla abierta, los días después de la baja quedan como “no laboraba” (no se pagan).</li><li>Se cancelan sus solicitudes pendientes y se quitan sus horarios futuros.</li><li>Sus préstamos con saldo quedan pendientes para la liquidación.</li></ul></div>
    <div class="pie"><button class="btn rojo">Dar de baja</button></div></form>`);
  const f = $('form', h.el);
  f.onsubmit = async ev => {
    ev.preventDefault(); const x = formData(f); const b = $('button.rojo', f); b.disabled = true;
    try {
      const r = await q(sb.rpc('pl_dar_baja', { p_emp: e.id, p_fecha: x.fecha, p_motivo: x.motivo, p_nota: x.nota || null }));
      if (x.acceso && e.user_id) { try { await fnUsuarios({ accion: 'desvincular', empleado_id: e.id }); } catch (er) { toast('La baja se guardó, pero no se pudo quitar el acceso: ' + errMsg(er), true); } }
      h.cerrar();
      toast(`${corto(e.nombre)} dado de baja${r?.dias_asistencia ? ` · ${r.dias_asistencia} días sin pago en la planilla abierta` : ''}${r?.solicitudes ? ` · ${r.solicitudes} solicitudes canceladas` : ''}`);
      despues();
    } catch (er) { b.disabled = false; toast(errMsg(er), true); }
  };
}

/* ===================== ADMIN: liquidación ===================== */
async function vLiquidacion(id) {
  cargando();
  const [e, comps, pres, vac] = await Promise.all([
    q(sb.from('pl_empleados').select('*').eq('id', id).single()),
    q(sb.from('pl_comprobantes').select('neto,datos').eq('empleado_id', id).eq('anulado', false)).then(r => r.map(c => ({ ...c, periodo: c.datos?.periodo, ganado: ganado(c) }))),
    q(sb.from('pl_prestamos_saldo').select('codigo,saldo').eq('empleado_id', id)),
    q(sb.rpc('pl_vacaciones_resumen', { p_emp: id }))]);
  const com = comps.filter(c => c.periodo?.tipo === 'comisiones').sort((a, b) => String(b.periodo.fecha_fin).localeCompare(String(a.periodo.fecha_fin))).slice(0, 6);
  const promCom = com.length ? Math.round(com.reduce((a, c) => a + c.ganado, 0) / com.length) : 0;
  const saldoPres = pres.reduce((a, p) => a + Math.max(0, +p.saldo), 0);
  const m = shell(`<div class="miga"><a href="#/empleado/${id}">${esc(e.nombre)}</a></div>
    <div class="top"><div><h1>Cálculo de liquidación</h1><div class="muted small">Solo administración · cálculo de referencia según el Código del Trabajo de Honduras</div></div><div class="acc"><button class="btn pri" id="imp">${ICON.print}Imprimir</button></div></div>
    <div style="display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:16px" class="liq">
      <div class="panel"><form id="fl" style="display:grid;gap:12px">
        <label class="f">Fecha de salida<input class="inp" type="date" name="salida" value="${e.fecha_baja || iso(hoyHN())}" required></label>
        <label class="f">Motivo<select class="inp" name="motivo"><option value="despido">Despido sin justa causa</option><option value="renuncia">Renuncia</option><option value="justa">Despido con justa causa</option><option value="mutuo">Mutuo acuerdo</option></select></label>
        <label class="f">Salario mensual ordinario (L)<input class="inp" type="number" name="salario" value="${+e.salario_mensual}" step="1"></label>
        <label class="f">Promedio mensual de comisiones (L)<input class="inp" type="number" name="comisiones" value="${promCom}" step="1"><span class="tiny muted">${com.length ? `Promedio de los últimos ${com.length} mes(es)` : 'Sin comisiones registradas'}</span></label>
        <label class="f">Días de vacaciones pendientes<input class="inp" type="number" name="vac" value="${+vac.saldo || 0}" step="0.5"></label>
        <label class="f">Días de salario pendientes de pago<input class="inp" type="number" name="salpend" value="0" step="1"></label>
        <label class="chk"><input type="checkbox" name="pre">Incluir preaviso</label>
        <label class="chk"><input type="checkbox" name="ces">Incluir auxilio de cesantía</label>
        <label class="chk"><input type="checkbox" name="pres" ${saldoPres > 0 ? 'checked' : ''}>Descontar saldo de préstamos (${L(saldoPres)})</label>
      </form></div>
      <div id="res"></div></div>
    <p class="tiny muted" style="margin-top:14px">Referencia: preaviso art. 116, cesantía art. 120 (máx. 25 meses), vacaciones art. 346, décimo tercer y cuarto mes proporcionales (días ÷ 360). Valídalo con el contador o asesor legal antes de pagar.</p>`);
  const f = $('#fl', m);
  if (e.fecha_baja && BAJA_LIQ[e.motivo_baja]) f.motivo.value = BAJA_LIQ[e.motivo_baja];
  const setDef = () => { const mo = f.motivo.value; f.pre.checked = mo === 'despido'; f.ces.checked = mo === 'despido' || mo === 'mutuo'; };
  let ultimo = null;
  const calc = () => {
    const x = formData(f); const sal = +x.salario || 0, comi = +x.comisiones || 0, prom = sal + comi, diario = prom / 30, diarioOrd = sal / 30;
    const salida = x.salida; const ing = e.fecha_ingreso;
    if (!ing) { $('#res', m).innerHTML = '<div class="err">Falta la fecha de ingreso del empleado.</div>'; return; }
    const dias = difDias(ing, salida) + 1;
    const anios = Math.floor(dias / 365), resto = dias - anios * 365;
    const preDias = dias < 91 ? 1 : dias < 183 ? 7 : dias < 365 ? 14 : dias < 730 ? 30 : 60;
    const cesDias = dias < 91 ? 0 : dias < 183 ? 10 : dias < 365 ? 20 : Math.min(750, dias / 365 * 30);
    // vacaciones proporcionales del año en curso
    let k = 1, ult = ing;
    for (;;) { const d = pf(ing); d.setFullYear(d.getFullYear() + k); if (d > pf(salida)) break; ult = iso(d); k++; }
    const diasVacSig = k <= 1 ? 10 : k === 2 ? 12 : k === 3 ? 15 : 20;
    const vacProp = diasVacSig * Math.max(0, difDias(ult, salida)) / 365;
    const y = pf(salida).getFullYear();
    const ini13 = [iso(new Date(y, 0, 1)), ing].sort().pop();
    const ini14 = [pf(salida).getMonth() >= 6 ? iso(new Date(y, 6, 1)) : iso(new Date(y - 1, 6, 1)), ing].sort().pop();
    const d13 = Math.min(360, Math.max(0, difDias(ini13, salida) + 1)), d14 = Math.min(360, Math.max(0, difDias(ini14, salida) + 1));
    const lineas = [
      ['Salario pendiente', `${N(+x.salpend)} días × ${L(diarioOrd)}`, +x.salpend * diarioOrd],
      ['Vacaciones pendientes', `${N(+x.vac)} días × ${L(diario)}`, +x.vac * diario],
      ['Vacaciones proporcionales', `${N(vacProp)} días × ${L(diario)}`, vacProp * diario],
      ['Décimo tercer mes proporcional', `${L(sal)} × ${d13} días ÷ 360`, sal * d13 / 360],
      ['Décimo cuarto mes proporcional', `${L(sal)} × ${d14} días ÷ 360`, sal * d14 / 360],
      ...(x.pre ? [['Preaviso', `${preDias} días × ${L(diario)}`, preDias * diario]] : []),
      ...(x.ces ? [['Auxilio de cesantía', `${N(cesDias)} días × ${L(diario)}`, cesDias * diario]] : []),
    ].map(([a, b, c]) => [a, b, Math.round(c)]);
    const total = lineas.reduce((a, l) => a + l[2], 0);
    const desc = x.pres ? Math.round(saldoPres) : 0;
    ultimo = { lineas, total, desc, neto: total - desc, dias, anios, resto, salida, motivo: f.motivo.selectedOptions[0].text, prom };
    $('#res', m).innerHTML = htmlLiquidacion(e, ultimo);
  };
  f.motivo.onchange = () => { setDef(); calc(); };
  f.oninput = calc; f.onchange = calc;
  setDef(); calc();
  $('#imp', m).onclick = () => { $('#imprimir').innerHTML = htmlLiquidacion(e, ultimo, true); setTimeout(() => window.print(), 60); };
}
function htmlLiquidacion(e, r, impresion = false) {
  return `<article class="cp"><header class="cp-cab"><div>${marcaDoc()}<div class="tit">Cálculo de liquidación · ${esc(r.motivo)}</div></div><div class="nro">Salida<b>${fc(r.salida)}</b></div></header>
    <section class="cp-quien"><div class="nom">${esc(e.nombre)}</div>
      <div class="cp-dato"><span>Fecha de ingreso</span><span>${fc(e.fecha_ingreso)}</span></div>
      <div class="cp-dato"><span>Antigüedad</span><span>${r.anios} año(s) y ${r.resto} días</span></div>
      <div class="cp-dato"><span>Salario promedio mensual</span><span>${L(r.prom)}</span></div>
      ${e.cargo ? `<div class="cp-dato"><span>Cargo</span><span>${esc(e.cargo)}</span></div>` : ''}</section>
    <div class="cp-col">${r.lineas.map(([a, b, c]) => `<div class="cp-l"><span>${a}</span><span class="mt">${L(c)}</span><span class="dt">${b}</span></div>`).join('')}
      <div class="cp-tot"><span>Total prestaciones</span><span class="num">${L(r.total)}</span></div>
      ${r.desc ? `<div class="cp-l"><span>Menos saldo de préstamos</span><span class="mt">−${L(r.desc)}</span></div>` : ''}</div>
    <div class="cp-neto"><div class="k">Total a pagar<small>Cálculo de referencia</small></div><div class="v">${L(r.neto)}</div></div>
    ${impresion ? `<div class="cp-firma" style="display:grid"><div>Por la empresa</div><div>Recibí conforme · ${esc(e.nombre)}</div></div>` : ''}</article>`;
}

/* ===================== arranque ===================== */
// Versión de esta copia de la app. Debe coincidir con version.json; al publicar una nueva se suben las dos.
const APP_VERSION = '56';
/* Actualización automática: la app revisa version.json (archivo pequeño) al abrir, al volver a la app y cada 15 minutos.
   Si hay una versión nueva: si la persona no está escribiendo ni tiene una ventana abierta, recarga sola;
   si está en medio de algo, muestra un aviso con el botón "Actualizar". */
let swReg = null, avisoAct = false, recargando = false;
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw-planilla.js', { updateViaCache: 'none' }).then(r => { swReg = r; }).catch(() => { }));
}
const ocupado = () => !!document.querySelector('.velo') || (document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && !!document.activeElement.value);
async function aplicarActualizacion() {
  if (recargando) return; recargando = true;
  try { if (swReg) await swReg.update(); } catch (_) { }
  try { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } catch (_) { }
  location.reload();
}
window.aplicarActualizacion = aplicarActualizacion;
function avisarActualizacion() {
  if (avisoAct) return; avisoAct = true;
  const b = document.createElement('div'); b.className = 'act-banda'; b.setAttribute('role', 'status');
  b.innerHTML = '<span>Hay una nueva versión de la app</span><button type="button">Actualizar</button>';
  b.querySelector('button').onclick = aplicarActualizacion; document.body.appendChild(b);
}
async function revisarVersion() {
  if (recargando || !navigator.onLine || location.protocol === 'file:') return;
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return;
    const v = String((await r.json()).version || '').trim();
    if (!v || v === APP_VERSION) return;
    // evita recargar en bucle si el servidor todavía entrega la copia anterior
    let intento = ''; try { intento = sessionStorage.getItem('mp_act') || ''; } catch (_) { }
    if (ocupado() || intento === v) return avisarActualizacion();
    try { sessionStorage.setItem('mp_act', v); } catch (_) { }
    aplicarActualizacion();
  } catch (_) { }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') revisarVersion(); });
window.addEventListener('online', revisarVersion);
setInterval(revisarVersion, 15 * 60 * 1000);
setTimeout(revisarVersion, 3000);
let promptInstalar = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); promptInstalar = e; $$('[data-instalar]').forEach(b => b.hidden = false); });
async function instalarApp() { if (!promptInstalar) return; promptInstalar.prompt(); await promptInstalar.userChoice; promptInstalar = null; $$('[data-instalar]').forEach(b => b.hidden = true); }
window.instalarApp = instalarApp;
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') { S.user = null; } });
iniciar();
</script>
