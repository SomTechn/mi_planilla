<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2A66">
<title>Mi Planilla</title>
<link rel="manifest" href="planilla.webmanifest?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="mi-planilla-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="mi-planilla-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="mi-planilla-180.png">
<meta name="apple-mobile-web-app-title" content="Mi Planilla">
<meta name="application-name" content="Mi Planilla">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<style>
:root{
  --azul:#1877F2; --azul2:#0B5AD6; --amarillo:#FFD400; --tinta:#0A2A66; --fondo:#F7FAFF;
  --blanco:#fff; --linea:#DCE6F5; --gris:#5B6B86; --gris2:#8A97AE; --suave:#EAF2FE;
  --verde:#0E9F6E; --rojo:#D93838; --naranja:#E8890C; --morado:#7A4CD9;
  --r-s:8px; --r-m:14px; --r-l:20px;
  --sombra:0 1px 2px rgba(10,42,102,.06),0 6px 20px -8px rgba(10,42,102,.18);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--tinta);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Poppins,Inter,sans-serif;margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:24px;font-weight:700} h2{font-size:19px;font-weight:700} h3{font-size:16px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--azul2)}
.hidden{display:none!important}
.num{font-family:Poppins,sans-serif;font-variant-numeric:tabular-nums;font-weight:600}
.muted{color:var(--gris)} .small{font-size:13px} .tiny{font-size:12px}
:focus-visible{outline:3px solid var(--amarillo);outline-offset:2px}

/* ---------- login ---------- */
.login{min-height:100dvh;display:grid;grid-template-rows:1fr auto;background:var(--tinta);color:#fff}
.login-in{display:flex;flex-direction:column;justify-content:center;padding:32px 20px;max-width:420px;width:100%;margin:0 auto}
.marca{display:flex;align-items:baseline;gap:6px;font-family:Poppins;font-weight:800;font-size:30px;letter-spacing:-.03em}
.marca .p{color:var(--amarillo)}
.marca-sub{font-family:Poppins;font-weight:500;color:#AFC6F0;margin:4px 0 28px}
.app-marca{display:flex;align-items:center;gap:10px;font-family:Poppins;font-weight:800;font-size:21px;letter-spacing:-.02em;color:#fff;line-height:1}
.app-marca img{width:34px;height:34px;border-radius:9px;flex:none}
.app-marca .mi{color:#FF7A1A}
.emp-logo{display:inline-flex;align-items:center;background:#fff;border-radius:10px;padding:6px 10px}
.emp-logo img{display:block;max-height:46px;max-width:190px;object-fit:contain}
.marca.emp-txt{font-size:22px;letter-spacing:-.01em;line-height:1.15;max-width:320px}
.login-emp{display:flex;justify-content:center;margin:2px 0 6px}.login-emp .emp-logo img{max-height:56px;max-width:220px}
.login-pie b{color:#fff;font-weight:600}
.logo-prev{display:flex;align-items:center;justify-content:center;min-height:90px;border:1.5px dashed #C9D6EE;border-radius:12px;background:#F6F9FF;padding:10px}
.logo-prev img{max-height:80px;max-width:240px;object-fit:contain}
.side .app-marca{padding:0 8px 2px}
.mob-head .app-marca{font-size:19px}.mob-head .app-marca img{width:30px;height:30px;border-radius:8px}
.login-logo{display:block;width:min(230px,70%);margin:0 auto 4px}
.login-sub{text-align:center;color:#AFC6F0;font-family:Poppins;font-weight:500;margin:10px 0 24px}
.login-logo-wrap{background:#fff;border-radius:22px;padding:18px 18px 10px;margin-bottom:6px;box-shadow:0 20px 40px -20px rgba(0,0,0,.5)}
.login form{background:#fff;color:var(--tinta);border-radius:var(--r-l);padding:22px;display:grid;gap:14px;box-shadow:0 20px 40px -20px rgba(0,0,0,.5)}
.login-pie{text-align:center;color:#7F98C7;font-size:12px;padding:16px}
.billetes{height:10px;background:repeating-linear-gradient(90deg,var(--amarillo) 0 28px,var(--azul) 28px 56px)}

/* ---------- forms ---------- */
label.f{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--gris)}
.inp,select.inp,textarea.inp{width:100%;border:1.5px solid var(--linea);background:#fff;border-radius:var(--r-s);padding:10px 12px;font-size:15px;color:var(--tinta)}
.inp:focus{border-color:var(--azul);outline:none;box-shadow:0 0 0 3px rgba(24,119,242,.15)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.inp{min-width:0}
.chk{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--tinta);font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--azul)}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;background:var(--suave);color:var(--azul2);white-space:nowrap;min-height:42px}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--azul);color:#fff}
.btn.pri:hover{background:var(--azul2)}
.btn.ama{background:var(--amarillo);color:var(--tinta)}
.btn.rojo{background:#FDECEC;color:var(--rojo)}
.btn.borde{background:#fff;border:1.5px solid var(--linea);color:var(--tinta)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:18px;height:18px}
.err{background:#FDECEC;color:var(--rojo);border-radius:var(--r-s);padding:10px 12px;font-size:14px}

/* ---------- shell ---------- */
.shell{min-height:100dvh;display:grid;grid-template-columns:240px minmax(0,1fr);background:linear-gradient(90deg,var(--tinta) 240px,var(--fondo) 240px)}
.side{background:var(--tinta);color:#fff;padding:20px 14px;position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:4px}
.side .marca{font-size:22px;padding:0 10px 2px}
.side-top{display:flex;justify-content:space-between;align-items:flex-start}
.side-x{display:none;place-items:center;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:22px;line-height:1;cursor:pointer}
.side-velo{display:none}
.hamb{display:flex;flex-direction:column;justify-content:center;gap:4px;width:38px;height:38px;padding:0 9px!important;border-radius:10px!important;border:0!important;background:rgba(255,255,255,.08)!important;margin-right:10px;cursor:pointer}
.hamb span{display:block;height:2px;border-radius:2px;background:#fff}
@media (prefers-reduced-motion:reduce){.side,.side-velo{transition:none!important}}
.side .marca-sub{font-size:12px;margin:0 10px 20px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:#C9D8F5;text-decoration:none;font-weight:500}
.nav a svg{width:20px;height:20px;flex:none}
.nav a.on{background:rgba(255,255,255,.1);color:#fff}
.nav a.on svg{color:var(--amarillo)}
.badge{margin-left:auto;background:var(--amarillo);color:var(--tinta);border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;min-width:20px;text-align:center}
.bottom .badge{position:absolute;margin:0;transform:translate(14px,-4px)}
.bottom a{position:relative}
.nav-g{font-size:11px;color:#7F98C7;font-weight:600;padding:14px 12px 4px}
.side{overflow-y:auto}
.side-pie{margin-top:auto;padding:10px;font-size:13px;color:#9FB5E0;display:grid;gap:8px}
.side-pie button{background:none;border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:6px 12px;cursor:pointer}
main{padding:24px 28px 100px;max-width:1180px;width:100%;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top .acc{display:flex;gap:8px;flex-wrap:wrap}
.miga{font-size:13px;color:var(--gris);margin-bottom:4px}
.miga a{text-decoration:none}
.bottom{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);background:var(--fondo)}
  .side{position:fixed;top:0;left:0;bottom:0;width:min(290px,84vw);height:100dvh;z-index:70;transform:translateX(-102%);transition:transform .22s ease;box-shadow:8px 0 30px rgba(0,0,0,.25);padding-top:calc(16px + env(safe-area-inset-top))}
  body.menu-abierto .side{transform:none}
  .side-velo{display:block;position:fixed;inset:0;background:rgba(10,42,102,.45);z-index:65;opacity:0;pointer-events:none;transition:opacity .2s}
  body.menu-abierto .side-velo{opacity:1;pointer-events:auto}
  body.menu-abierto{overflow:hidden}
  .side-x{display:grid!important}
  main{padding:16px 16px 96px}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--linea);z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--gris);text-decoration:none;padding:4px 0;font-weight:500}
  .bottom a svg{width:22px;height:22px}
  .bottom a.on{color:var(--azul2)}
  .mob-head{display:flex!important}
  h1{font-size:21px}
}
.mob-head{display:none;align-items:center;justify-content:flex-start;background:var(--tinta);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:25}
.mob-head .marca{font-size:20px}
.mob-head button{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:5px 12px;font-size:13px}

/* ---------- surfaces ---------- */
.panel{background:#fff;border:1px solid var(--linea);border-radius:var(--r-m);padding:16px}
.lista{display:grid;gap:10px}
.item{background:#fff;border:1px solid var(--linea);border-radius:var(--r-m);padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;text-decoration:none;color:inherit}
.item:hover{border-color:#B9CDEE}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600}
.item .s{font-size:13px;color:var(--gris)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--suave);color:var(--azul2)}
.chip.ok{background:#E3F6EE;color:var(--verde)} .chip.warn{background:#FFF6CC;color:#8A6A00} .chip.red{background:#FDECEC;color:var(--rojo)} .chip.gris{background:#EEF1F6;color:var(--gris)}
.vacio{text-align:center;padding:36px 16px;color:var(--gris);background:#fff;border:1.5px dashed var(--linea);border-radius:var(--r-m)}
.vacio b{display:block;color:var(--tinta);font-family:Poppins;font-size:16px;margin-bottom:4px}

/* KPI strip (planilla period) */
.totales{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--linea);border:1px solid var(--linea);border-radius:var(--r-m);overflow:hidden;margin-bottom:16px}
.totales>div{background:#fff;padding:12px 14px}
.totales .k{font-size:12px;color:var(--gris);font-weight:500}
.totales .v{font-family:Poppins;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.totales .neto{background:var(--amarillo)}
.totales .neto .k{color:var(--tinta)}
@media (max-width:640px){.totales{grid-template-columns:1fr 1fr}.totales .v{font-size:17px}}

.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--linea);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--gris);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tabs a.on{color:var(--tinta);border-color:var(--azul)}

table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:600;color:var(--gris);font-size:12px;padding:8px 10px;border-bottom:1.5px solid var(--linea);white-space:nowrap}
table.t td{padding:10px;border-bottom:1px solid #EEF2F8;vertical-align:middle}
table.t th.ordenable{cursor:pointer;user-select:none}
table.t th.ordenable:hover{color:var(--tinta)}
table.t th[aria-sort=ascending],table.t th[aria-sort=descending]{color:var(--azul2)}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:#F7FAFF}
table.t .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tfoot td{font-weight:700;border-top:1.5px solid var(--linea);border-bottom:0}
.tscroll{overflow-x:auto;background:#fff;border:1px solid var(--linea);border-radius:var(--r-m)}

/* ---------- attendance grid ---------- */
.leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--gris);margin:0 0 12px}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.m{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;font-family:Poppins;font-weight:600;font-size:12px;border:0;cursor:pointer;position:relative}
.m-R{background:#FFF4C2;color:#8A6A00}
.m-T{background:#E6F0FE;color:var(--azul2)} .m-F{background:#FDE2E2;color:var(--rojo)} .m-V{background:#E3F6EE;color:var(--verde)}
.m-I{background:#EFE7FD;color:var(--morado)} .m-P{background:#FFE9CC;color:#9A5A00} .m-L{background:#EEF1F6;color:var(--gris)} .m-N{background:#fff;color:#B5C0D3;border:1px dashed #C9D3E4}
.m.parcial::after{content:"";position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:50%;background:var(--naranja)}
.m.extra::before{content:"";position:absolute;left:3px;bottom:3px;width:6px;height:6px;border-radius:50%;background:var(--amarillo);box-shadow:0 0 0 1px var(--tinta)}
.grid-asis{border-collapse:separate;border-spacing:0}
.grid-asis th,.grid-asis td{padding:4px 3px;text-align:center}
.grid-asis th{font-size:11px;color:var(--gris);font-weight:600;position:sticky;top:0;background:#fff}
.grid-asis th.dom{color:var(--rojo)}
.grid-asis td.n,.grid-asis th.n{text-align:left;position:sticky;left:0;background:#fff;z-index:2;padding-left:12px;min-width:150px;max-width:180px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--linea)}
.grid-asis td.h{font-family:Poppins;font-weight:600;font-size:13px;padding:0 12px;white-space:nowrap}

/* ---------- sheet / modal ---------- */
.velo{position:fixed;inset:0;background:rgba(10,42,102,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.hoja{background:#fff;border-radius:var(--r-l);width:100%;max-width:520px;max-height:92dvh;overflow:auto;padding:20px;box-shadow:0 30px 60px -20px rgba(10,42,102,.5)}
.hoja.ancha{max-width:860px}
.hoja-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.hoja-top .x{background:var(--suave);border:0;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:18px;color:var(--tinta)}
.hoja form{display:grid;gap:12px}
.hoja .pie{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap}
@media (max-width:640px){.velo{align-items:flex-end;padding:0}.hoja{border-radius:var(--r-l) var(--r-l) 0 0;max-height:94dvh;padding-bottom:calc(20px + env(safe-area-inset-bottom))}}
.marcas{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.marcas button{border:1.5px solid var(--linea);background:#fff;border-radius:10px;padding:8px 4px;cursor:pointer;display:grid;justify-items:center;gap:4px;font-size:12px;font-weight:500}
.marcas button.on{border-color:var(--azul);box-shadow:0 0 0 3px rgba(24,119,242,.15)}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 18px;border-radius:999px;z-index:80;font-weight:500;box-shadow:var(--sombra);max-width:90vw}
.toast.mal{background:var(--rojo)}
.btn-copiar{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;margin-left:2px;vertical-align:middle;border:0;border-radius:8px;background:#EEF3FC;color:var(--azul2,#1877F2);cursor:pointer;padding:0}.btn-copiar:active{background:#D9E6FB}
.sup-movil{display:none}.sup-movil .item{gap:10px}
@media (max-width:700px){.sup-movil{display:grid}.sup-escr{display:none}}
/* ===== bloqueo con PIN ===== */
.candado{position:fixed;inset:0;z-index:300;background:var(--tinta);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom));overflow:auto}
.candado .cz{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:6px}
.candado .cz-logo{width:64px;height:64px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:6px}
.candado .cz-logo img{max-width:56px;max-height:56px;object-fit:contain}
.candado h2{font-family:Poppins;font-size:20px;margin:6px 0 0;color:#fff;text-align:center}
.candado .cz-sub{color:#AFC6F0;font-size:14px;text-align:center;min-height:20px}
.candado .cz-err{color:#FFB4A8;font-size:13px;min-height:18px;text-align:center}
.pin-pts{display:flex;gap:16px;margin:18px 0 6px}
.pin-pts i{width:15px;height:15px;border-radius:50%;border:2px solid #AFC6F0;transition:.15s}
.pin-pts i.on{background:#FFD400;border-color:#FFD400}
.pin-pts.mal{animation:pinmal .35s}
@keyframes pinmal{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.pin-tec{display:grid;grid-template-columns:repeat(3,76px);gap:14px;margin-top:14px}
.pin-tec button{height:76px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;font-family:Poppins;font-size:26px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.pin-tec button:active{background:rgba(255,255,255,.25)}
.pin-tec button.lt{background:none;font-size:14px;font-weight:500}
.pin-tec button svg{width:30px;height:30px}
.pin-tec button[disabled]{visibility:hidden}
.candado .cz-link{background:none;border:0;color:#AFC6F0;text-decoration:underline;font-size:13px;margin-top:18px;cursor:pointer;font-family:inherit}
body.bloqueada #app{visibility:hidden}

.act-banda{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:90;display:flex;align-items:center;gap:12px;background:#0A2A66;color:#fff;padding:10px 10px 10px 16px;border-radius:14px;box-shadow:0 10px 30px rgba(10,42,102,.35);font-size:14px;width:max-content;max-width:calc(100% - 32px)}
.act-banda button{background:#FFD400;color:#0A2A66;border:0;border-radius:10px;padding:8px 14px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}
@media (min-width:900px){.act-banda{bottom:24px}}
.cargando{padding:40px;text-align:center;color:var(--gris)}

/* ---------- comprobante (pay stub) ---------- */
.cp{background:#fff;border-radius:var(--r-m);overflow:hidden;box-shadow:var(--sombra);max-width:780px;margin:0 auto;border:1px solid var(--linea);position:relative}
.cp-cab{background:var(--tinta);color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.cp-cab .marca{font-size:24px}.cp-cab .marca.emp-txt{font-size:20px}
.cp-cab .tit{font-family:Poppins;font-weight:600;font-size:14px;color:#AFC6F0;margin-top:2px}
.cp-cab .nro{text-align:right;font-size:12px;color:#AFC6F0}
.cp-cab .nro b{display:block;font-family:Poppins;color:#fff;font-size:16px;white-space:nowrap}
.cp-cab .nro .chip{margin-top:4px}
.cp-quien{padding:16px 22px 6px;display:grid;grid-template-columns:1.4fr 1fr;gap:6px 24px}
.cp-quien .nom{font-family:Poppins;font-weight:700;font-size:19px;grid-column:1/-1}
.cp-dato{display:flex;justify-content:space-between;gap:12px;font-size:13px;border-bottom:1px dotted var(--linea);padding:4px 0}

  .cp{box-shadow:none;border:1px solid #999;page-break-inside:avoid;break-inside:avoid;margin-bottom:10mm}
  .cp-firma{display:grid!important}
  .cp-neto,.cp-cab,.totales .neto{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cp + .cp{page-break-before:always}
  .carta{border:0;box-shadow:none;border-radius:0;max-width:none;padding:6mm 10mm 0;font-size:12.5pt}
  .carta-mem:after{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:no-preference){
  .hoja{animation:sube .18s ease-out}
  @keyframes sube{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}
}

/* ---------- venta del servicio ---------- */
.lp{min-height:100dvh;background:var(--fondo)}
.lp-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:var(--tinta);flex-wrap:wrap}
.lp-nav nav{display:flex;align-items:center;gap:14px}
.lp-nav nav a:not(.btn){color:#DCE8FF;text-decoration:none;font-weight:600;font-size:14px}
.lp-hero{background:var(--tinta);color:#fff;text-align:center;padding:48px 16px 56px}
.lp-hero h1{font-size:clamp(30px,6vw,48px);font-weight:800;letter-spacing:-.03em;max-width:760px;margin:0 auto}
.lp-hero h1 span{color:var(--amarillo)}
.lp-hero p{color:#C9D9F5;font-size:17px;max-width:600px;margin:16px auto 26px}
.lp-cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.lp-sec{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.35)}
.lp-nota{font-size:13px;color:#AFC6F0;margin-top:14px;text-align:center}
.lp-sec-b{max-width:1040px;margin:0 auto;padding:48px 16px}
.lp-sec-b>h2{text-align:center;font-size:clamp(22px,4vw,30px);margin-bottom:22px}
.lp-alt{max-width:none;background:#fff;border-block:1px solid var(--linea)}
.lp-alt>*{max-width:1040px;margin-left:auto;margin-right:auto}
.lp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.lp-f{background:#fff;border:1px solid var(--linea);border-radius:var(--r-m);padding:18px}
.lp-f h3{margin:10px 0 4px}.lp-f p{margin:0;color:var(--gris);font-size:14px}
.lp-ic{width:42px;height:42px;border-radius:12px;background:var(--suave);color:var(--azul2);display:grid;place-items:center}.lp-ic svg{width:22px;height:22px}
.lp-planes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px;align-items:stretch}
.lp-plan{background:#fff;border:1.5px solid var(--linea);border-radius:var(--r-l);padding:20px;display:flex;flex-direction:column;gap:6px}
.lp-plan.dest{border-color:var(--azul);box-shadow:var(--sombra)}
.lp-plan .chip{align-self:flex-start}
.lp-plan .btn{margin-top:auto}
.lp-plan p{margin:2px 0 8px;color:var(--gris)}
.lp-precio{font-family:Poppins;font-weight:800;font-size:30px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.lp-precio span{font-size:14px;font-weight:500;color:var(--gris)}
.lp-planes.in .lp-precio{font-size:24px}.lp-planes.in .lp-plan{padding:16px;border-radius:var(--r-m)}
.lp-pasos ol{list-style:none;padding:0;margin:0 0 26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px;counter-reset:p}
.lp-pasos li{counter-increment:p;background:#fff;border:1px solid var(--linea);border-radius:var(--r-m);padding:16px 16px 16px 58px;position:relative;color:var(--gris);font-size:14px}
.lp-pasos li b{display:block;color:var(--tinta);font-size:15px}
.lp-pasos li::before{content:counter(p);position:absolute;left:16px;top:16px;width:30px;height:30px;border-radius:50%;background:var(--amarillo);color:var(--tinta);font:700 15px/30px Poppins;text-align:center}
.lp-legal{max-width:760px}.lp-legal h1{margin-bottom:6px}.lp-legal h3{margin:22px 0 6px}.lp-legal p{color:#33425E}
.lp-pago{display:flex;gap:10px 24px;flex-wrap:wrap}.lp-pago div{display:grid}
.lp-trampa{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.login-alta{text-align:center;color:#AFC6F0;font-size:14px;margin:18px 0 0}.login-alta a{color:var(--amarillo);font-weight:600}
.susc-banda{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#FFF6CC;color:#5C4700;border-radius:var(--r-m);padding:10px 14px;margin-bottom:16px;font-size:14px}
.push-banda,.info-banda{background:var(--suave);color:var(--tinta)}.push-banda .acc{display:flex;gap:8px}
.susc-banda.mal{background:#FDECEC;color:var(--rojo)}
.susc-banda a{font-weight:700;color:inherit}

/* ===================== modal ===================== */
function hoja(titulo, html, { ancha = false, alCerrar = null } = {}) {
  const v = document.createElement('div'); v.className = 'velo';
  v.innerHTML = `<div class="hoja ${ancha ? 'ancha' : ''}" role="dialog" aria-modal="true"><div class="hoja-top"><h2>${esc(titulo)}</h2><button class="x" aria-label="Cerrar">×</button></div><div class="hoja-c">${html}</div></div>`;
  const cerrar = () => { v.remove(); document.removeEventListener('keydown', k); try { alCerrar && alCerrar(); } catch (_) { } };
  const k = e => { if (e.key === 'Escape') cerrar(); };
  document.addEventListener('keydown', k);
  v.addEventListener('click', e => { if (e.target === v) cerrar(); });
  $('.x', v).onclick = cerrar;
  document.body.appendChild(v);
  setTimeout(() => $('input:not([type=hidden]),select', v)?.focus(), 30);
  return { el: v, cerrar };
}
function confirmar(titulo, texto, ok = 'Confirmar', peligro = false) {
  return new Promise(res => {
    const h = hoja(titulo, `<p class="muted" style="margin:0 0 16px">${texto}</p><div class="pie"><button class="btn borde" data-n>Cancelar</button><button class="btn ${peligro ? 'rojo' : 'pri'}" data-s>${esc(ok)}</button></div>`);
    $('[data-n]', h.el).onclick = () => { h.cerrar(); res(false); };
    $('[data-s]', h.el).onclick = () => { h.cerrar(); res(true); };
  });
}
const formData = f => Object.fromEntries(new FormData(f).entries());

/* ===================== sesión ===================== */
async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return publico();
  S.user = session.user;
  try {
    S.admin = !!(await q(sb.rpc('pl_es_admin')));
    S.yo = await q(sb.from('pl_empleados').select('*').eq('user_id', S.user.id).maybeSingle());
    S.autoriza = S.admin ? !!(await q(sb.rpc('pl_puede_autorizar'))) : false;
    S.supervisor = !S.admin && !!(await q(sb.rpc('pl_es_supervisor')));
    S.par = await parametros().catch(() => ({}));
    S.susc = await q(sb.rpc('pl_mi_suscripcion')).catch(() => null);
    S.superadmin = !!S.susc?.superadmin;
    recordarEmpresa();
  } catch (e) { toast(errMsg(e), true); }
  if (!S.admin && !S.yo && !S.supervisor && !S.superadmin) {
    app.innerHTML = `<div class="login"><div class="login-in"><div class="login-logo-wrap"><img class="login-logo" src="${APP_LOGO_IMG}" alt="Mi Planilla"></div><p class="login-sub">${esc(empNombre())}</p>
      <div class="err" style="background:#fff">Tu cuenta no está vinculada a ningún empleado. Pide al administrador que la vincule.</div>
      <button class="btn ama" style="margin-top:16px" onclick="salir()">Cerrar sesión</button></div></div>`;
    return;
  }
  if (!(await candado({ inicio: true }))) return;
  refrescarPush();

let plataformaCache = null;
async function plataforma() {
  if (plataformaCache) return plataformaCache;
  const [pl, cfg] = await Promise.all([sb.from('pl_planes').select('*').order('orden'), sb.from('pl_plataforma').select('*')]);
  plataformaCache = { planes: pl.data || [], cfg: Object.fromEntries((cfg.data || []).map(r => [r.clave, r.valor || ''])) };
  return plataformaCache;
}

  const planPago = planes.find(p => p.codigo === e.plan && !aCotizar(p)) ? e.plan : (planes.find(p => p.publico && !aCotizar(p) && (!p.max_empleados || p.max_empleados >= susc.empleados))?.codigo || '');

  $$('[data-plan]', m).forEach(b => b.onclick = () => reportarTransferencia(b.dataset.plan, planes, cuenta, e));
  $$('[data-cotizar]', m).forEach(b => b.onclick = () => solicitarCotizacion(susc.empleados));
  $$('[data-cancelar]', m).forEach(b => b.onclick = async () => {
    if (!await confirmar('Cancelar reporte', 'El reporte se retira y ya no lo revisaremos. Puedes enviar uno nuevo cuando quieras.', 'Cancelar reporte', true)) return;
    try { await q(sb.rpc('pl_cancelar_reporte', { p_id: b.dataset.cancelar })); toast('Reporte cancelado'); vSuscripcion(); } catch (er) { toast(errMsg(er), true); }
  });
  return m;
}

function reportarTransferencia(plan, planes, cuenta, emp) {
  const opciones = planes.filter(p => !aCotizar(p) && (p.publico || p.codigo === plan));
  const precio = c => +(planes.find(p => p.codigo === c)?.precio_mensual || 0);
  const h = hoja('Reportar transferencia', `<form style="display:grid;gap:12px">
    <div class="lp-pago" style="background:var(--suave);border-radius:12px;padding:10px 12px">${cuenta.map(([k, v]) => `<div><span class="tiny muted">${k}</span><b>${esc(v)}${k === 'Número de cuenta' ? btnCopiar(v, 'Copiar número de cuenta') : ''}</b></div>`).join('')}</div>
    <label class="f">Plan<select class="inp" name="plan">${opciones.map(p => `<option value="${p.codigo}" ${p.codigo === plan ? 'selected' : ''}>${esc(p.nombre)} · ${L(p.precio_mensual).replace('.00', '')}/mes · ${limitePlan(p).toLowerCase()}</option>`).join('')}</select></label>
    <div class="row2"><label class="f">Meses que pagas<select class="inp" name="meses">${[1, 2, 3, 6, 12].map(n => `<option value="${n}">${n} ${n > 1 ? 'meses' : 'mes'}</option>`).join('')}</select></label>
      <label class="f">Monto (L)<input class="inp" type="number" step="0.01" min="1" name="monto" required inputmode="decimal"></label></div>
    <div class="row2"><label class="f">Fecha<input class="inp" type="date" name="fecha" value="${iso(hoyHN())}" max="${iso(hoyHN())}" required></label>
      <label class="f">N.º de referencia<input class="inp" name="referencia" required placeholder="Del comprobante"></label></div>
    <label class="f">Banco desde el que pagaste<input class="inp" name="banco" placeholder="Ej.: BAC, Atlántida, Ficohsa, Banpaís"></label>
    <label class="f">Foto o PDF del comprobante<input class="inp" type="file" name="archivo" accept="image/*,application/pdf" required></label>
    <label class="f">Nota (opcional)<input class="inp" name="nota"></label>
    <p class="tiny muted" style="margin:0">Revisamos la transferencia y, al confirmarla, tu plan se extiende desde ${emp.vence_en && pf(emp.vence_en) > hoyHN() ? `el ${fc(emp.vence_en)}` : 'hoy'}. Te llegará un aviso.</p>
    <div class="pie"><button class="btn pri">Enviar reporte</button></div></form>`);
  const f = $('form', h.el);
  const total = () => { f.monto.value = precio(f.plan.value) * (+f.meses.value || 1) || ''; };
  f.plan.onchange = total; f.meses.onchange = total; total();
  f.onsubmit = async ev => {
    ev.preventDefault(); const x = formData(f), arch = f.archivo.files[0], b = $('button.pri', f);
    if (arch && arch.size > 5 * 1024 * 1024) return toast('El comprobante pesa más de 5 MB; envía una foto más liviana', true);
    b.disabled = true; b.textContent = 'Enviando…';
    try {
      let ruta = null;
      if (arch) {
        const ext = (arch.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5) || 'jpg';
        ruta = `${emp.id}/${Date.now()}.${ext}`;
        const up = await sb.storage.from('pl-suscripcion').upload(ruta, arch, { contentType: arch.type || undefined, upsert: false });
        if (up.error) throw up.error;
      }
      await q(sb.rpc('pl_reportar_pago', { p_plan: x.plan, p_meses: +x.meses, p_monto: +x.monto, p_fecha: x.fecha, p_banco: x.banco, p_referencia: x.referencia, p_nota: x.nota || null, p_comprobante: ruta }));
      h.cerrar(); toast('Reporte enviado. Te avisaremos al confirmarlo.'); vSuscripcion();
    } catch (er) { b.disabled = false; b.textContent = 'Enviar reporte'; toast(errMsg(er), true); }
  };
}

/* ===================== notificaciones push ===================== */
// Avisos al teléfono: comprobantes, solicitudes resueltas, adelantos entregados y (para admin/supervisión) solicitudes nuevas.
const esIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
const enApp = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushSoportado = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && location.protocol === 'https:';
const b64aBytes = s => { const r = atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, c => c.charCodeAt(0)); };
async function fnPush(body) {
  const { data, error } = await sb.functions.invoke('planilla-push', { body });
  if (error) throw error;
  if (data?.error) throw new Error(data.error);
  return data;
}
async function suscribirPush() {

    const terminar = r => { document.removeEventListener('keydown', tecla); c.remove(); resolver(r); };
    titulos();
    const completo = async () => {
      ocupadoPin = true;
      try {
        if (modo === 'crear') {
          if (primero == null) { if (pinDebil(val)) return fallo('Ese PIN es muy fácil de adivinar. Usa otro.'); primero = val; val = ''; pintar(); E.textContent = ''; titulos(); return; }
          if (val !== primero) { primero = null; titulos(); return fallo('Los PIN no coinciden. Empieza de nuevo.'); }
          await pinNuevo(val); return terminar('ok');
        }
        if (await pinCorrecto(val)) { const d = pinDatos(); pinGuardar({ ...d, fallos: 0 }); return terminar('ok'); }
        const d = pinDatos(); const f = (d?.fallos || 0) + 1; pinGuardar({ ...d, fallos: f });
        if (f >= PIN_INTENTOS) { pinGuardar(null); return terminar('salir'); }
        fallo(`PIN incorrecto. ${PIN_INTENTOS - f === 1 ? 'Te queda 1 intento' : `Te quedan ${PIN_INTENTOS - f} intentos`}.`);
      } finally { ocupadoPin = false; }
    };
    const poner = n => { if (ocupadoPin || val.length >= PIN_LARGO) return; E.textContent = ''; val += n; pintar(); if (val.length === PIN_LARGO) setTimeout(completo, 120); };
    const borrar = () => { if (ocupadoPin) return; val = val.slice(0, -1); pintar(); };
    const usarBio = async () => { try { if (await bioVerificar()) { const d = pinDatos(); pinGuardar({ ...d, fallos: 0 }); terminar('ok'); } } catch (_) { E.textContent = 'No se reconoció la huella. Escribe tu PIN.'; } };
    $$('[data-n]', c).forEach(b => b.onclick = () => poner(b.dataset.n));
    $('[data-borrar]', c).onclick = borrar;
    $('[data-bio]', c).onclick = usarBio;
    $('[data-olvido]', c) && ($('[data-olvido]', c).onclick = () => terminar('olvido'));
    $('[data-cancelar]', c) && ($('[data-cancelar]', c).onclick = () => terminar('cancelar'));
    const tecla = e => { if (/^\d$/.test(e.key)) poner(e.key); else if (e.key === 'Backspace') borrar(); };
    document.addEventListener('keydown', tecla);
    if (bio && modo === 'abrir') setTimeout(usarBio, 350);
  });
}
async function salirPorPin(msg) { pinGuardar(null); bloqueada = false; document.body.classList.remove('bloqueada'); await salir(); if (msg) toast(msg, true); }
// Pide el PIN (o lo crea si este teléfono aún no tiene). Devuelve true cuando la app queda desbloqueada.
async function candado({ inicio = false } = {}) {
  if (!S.user) return true;
  let recien = false; try { recien = sessionStorage.getItem('mp_recien') === '1'; sessionStorage.removeItem('mp_recien'); } catch (_) { }
  bloqueada = true; document.body.classList.add('bloqueada');
  if (!pinDatos()?.hash) {
    const r = await pantallaPin({ modo: 'crear', titulo: 'Crea tu PIN', sub: `${PIN_LARGO} dígitos para abrir la app en este teléfono`, permitirOlvido: false });
    if (r !== 'ok') return false;
    if (await bioDisponible()) {
      const si = await confirmar('Usar huella', 'Puedes abrir la app con tu huella o tu rostro en lugar del PIN. ¿Activarlo en este teléfono?', 'Activar');
      if (si) { try { await bioRegistrar(); toast('Huella activada'); } catch (_) { toast('No se activó la huella. Puedes hacerlo luego en Seguridad.', true); } }
    }
  } else if (!(inicio && recien)) {
    const d = pinDatos(); const bio = !!d.bio && await bioDisponible();
    const r = await pantallaPin({ modo: 'abrir', titulo: S.yo ? `Hola, ${corto(S.yo.nombre)}` : 'App bloqueada', sub: bio ? 'Usa tu huella o escribe tu PIN' : 'Escribe tu PIN', bio });
    if (r === 'salir') { await salirPorPin('Se escribió mal el PIN 5 veces. Entra con tu contraseña y crea un PIN nuevo.'); return false; }
    if (r === 'olvido') { await salirPorPin('Entra con tu contraseña para crear un PIN nuevo.'); return false; }
  }
  bloqueada = false; document.body.classList.remove('bloqueada'); ultimaAct = Date.now();
  return true;
}
// Bloqueo por inactividad (5 minutos sin tocar la app, también si se dejó en segundo plano)
['pointerdown', 'keydown', 'touchstart', 'wheel', 'scroll'].forEach(ev => window.addEventListener(ev, () => { if (!bloqueada) ultimaAct = Date.now(); }, { passive: true, capture: true }));
function revisarInactividad() { if (S.user && !bloqueada && pinDatos()?.hash && Date.now() - ultimaAct >= BLOQUEO_MIN * 60000) candado(); }
setInterval(revisarInactividad, 15000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') revisarInactividad(); });

async function empleadosActivos() { return q(sb.from('pl_empleados').select('id,nombre,activo,recibe_salario,recibe_comisiones').order('nombre')); }
async function periodosAbiertos() { return q(sb.from('pl_periodos').select('*').eq('estado', 'abierta').order('fecha_inicio', { ascending: false })); }
async function conceptos() { if (!S.conceptos) S.conceptos = await q(sb.from('pl_conceptos').select('*').eq('activo', true).order('orden')); return S.conceptos; }

// En "Mis pagos" no se restan adelantos, vales ni cuotas de préstamos: es dinero que el empleado ya recibió
const esAnticipo = d => !!d.prestamo_id || /^(adelanto|vales?\b|vale comisiones|préstamo|prestamo)/i.test(String(d.concepto || '').trim());
const anticipado = c => (c?.deducciones || []).filter(esAnticipo).reduce((a, d) => a + +d.monto, 0);
const ganado = comp => +comp.neto + anticipado(comp.datos); // ingresos menos penalizaciones y otras deducciones reales
function resumenFila(c) {
  const ded = c.deducciones || [];
  const adel = ded.filter(d => /^Adelanto|^Vales \/ adelantos/.test(d.concepto)).reduce((a, d) => a + +d.monto, 0);
  const pres = ded.filter(d => d.prestamo_id).reduce((a, d) => a + +d.monto, 0);
  const otras = +c.total_deducciones - adel - pres;
  return { adel, pres, otras };
}

function sugerencia(tipo, per) {
  if (tipo === 'salario') {
    const ult = per.filter(p => p.tipo === 'salario').sort((a, b) => b.fecha_fin.localeCompare(a.fecha_fin))[0];
    let ini = ult ? pf(ult.fecha_fin) : hoyHN(); if (ult) ini.setDate(ini.getDate() + 1);
    else { const h = hoyHN(); ini = h.getDate() >= 4 && h.getDate() <= 18 ? new Date(h.getFullYear(), h.getMonth(), 4) : (h.getDate() > 18 ? new Date(h.getFullYear(), h.getMonth(), 19) : new Date(h.getFullYear(), h.getMonth() - 1, 19)); }
    const primera = ini.getDate() === 4;
    const fin = primera ? new Date(ini.getFullYear(), ini.getMonth(), 18) : new Date(ini.getFullYear(), ini.getMonth() + 1, 3);
    const codigo = `${ini.getFullYear()}${String(ini.getMonth() + 1).padStart(2, '0')}${primera ? '01' : '02'}`;
    const nombre = `${primera ? '1ª' : '2ª'} quincena de ${MESES[ini.getMonth()]} ${ini.getFullYear()}`;
    return { codigo, nombre, ini: iso(ini), fin: iso(fin), pago: iso(fin) };
  }
  const ult = per.filter(p => p.tipo === 'comisiones').sort((a, b) => b.fecha_fin.localeCompare(a.fecha_fin))[0];
  let ini;
  if (ult) { ini = pf(ult.fecha_fin); ini.setDate(ini.getDate() + 1); }
  else { const h = hoyHN(); ini = new Date(h.getFullYear(), h.getMonth() - (h.getDate() >= 9 ? 1 : 2), 9); }
  const fin = new Date(ini.getFullYear(), ini.getMonth() + 1, 8);
  const pago = new Date(ini.getFullYear(), ini.getMonth() + 1, 15);
  return { codigo: `C${ini.getFullYear()}${String(ini.getMonth() + 1).padStart(2, '0')}`, nombre: `Comisiones ${MESES[ini.getMonth()]} ${ini.getFullYear()}`, ini: iso(ini), fin: iso(fin), pago: iso(pago) };
}

  const ef = calc.filter(c => c.metodo_pago === 'EFECTIVO').reduce((a, c) => a + +c.neto, 0);
  const bancos = {}; calc.filter(c => c.metodo_pago !== 'EFECTIVO').forEach(c => { const b = c.banco || 'Sin banco'; bancos[b] = (bancos[b] || 0) + +c.neto; });

    <div class="cab"><div>${marcaDoc()}<div style="font-size:12px;color:#5B6B8C;margin-top:2px">${esc(par.empresa_nombre || '')}${par.empresa_rtn ? ' · RTN ' + esc(par.empresa_rtn) : ''}</div></div>
      <div style="text-align:right"><h2>${per.tipo === 'comisiones' ? 'PLANILLA DE COMISIONES' : 'PLANILLA DE SALARIOS'}</h2><div style="font-size:13px;margin-top:2px">${esc(per.nombre)}</div></div></div>
    <div class="meta"><div><span>Código</span>${esc(per.codigo)}</div><div><span>Período</span>${fc(per.fecha_inicio)} al ${fc(per.fecha_fin)}</div><div><span>Fecha de pago</span>${fc(per.fecha_pago)}</div><div><span>Empleados</span>${calc.length}</div><div><span>Estado</span>${abierta ? 'Abierta (borrador)' : `Cerrada${per.cerrado_en ? ' el ' + fc(per.cerrado_en.slice(0, 10)) : ''}`}</div></div>
    <table><thead><tr><th>#</th><th>Empleado</th><th>Cargo</th><th class="r">Ingresos</th><th class="r">Adelantos</th><th class="r">Préstamos</th><th class="r">Otras ded.</th><th class="r">Total ded.</th><th class="r">Neto a pagar</th><th>Forma de pago</th><th>Cuenta</th></tr></thead>
      <tbody>${filas.map(({ c, i, adel, pres, otras }) => `<tr><td>${i + 1}</td><td><b>${esc(c.nombre)}</b></td><td>${esc(c.cargo || '')}</td><td class="r">${L(c.total_ingresos)}</td><td class="r">${adel ? L(adel) : '—'}</td><td class="r">${pres ? L(pres) : '—'}</td><td class="r">${otras > 0.004 ? L(otras) : '—'}</td><td class="r">${L(c.total_deducciones)}</td><td class="r"><b>${L(c.neto)}</b></td><td>${c.metodo_pago === 'EFECTIVO' ? 'Efectivo' : 'Transf. ' + esc(c.banco || '')}</td><td>${esc(c.metodo_pago === 'EFECTIVO' ? '' : (c.cuenta || ''))}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td></td><td>TOTALES</td><td></td><td class="r">${L(sum(x => x.c.total_ingresos))}</td><td class="r">${L(sum(x => x.adel))}</td><td class="r">${L(sum(x => x.pres))}</td><td class="r">${L(sum(x => Math.max(0, x.otras)))}</td><td class="r">${L(sum(x => x.c.total_deducciones))}</td><td class="r">${L(sum(x => x.c.neto))}</td><td colspan="2"></td></tr></tfoot></table>
    <div class="bloques">
      ${per.tipo === 'comisiones' ? '<div></div>' : `<div class="bloque"><h4>Ingresos por concepto</h4>${conceptos('ingresos').map(([k, v]) => `<div><span>${esc(k)}</span><b>${L(v)}</b></div>`).join('') || '<div><span>—</span></div>'}</div>`}
      <div class="bloque"><h4>Forma de pago</h4><div><span>Efectivo</span><b>${L(ef)}</b></div>${Object.entries(bancos).map(([b, v]) => `<div><span>Transferencia ${esc(b)}</span><b>${L(v)}</b></div>`).join('')}<div style="border:0"><span><b>Total a pagar</b></span><b>${L(sum(x => x.c.neto))}</b></div></div>
    </div>
    <div class="firmas"><div>Elaborado por</div><div>Revisado por</div><div>Autorizado por${par.firma_nombre ? `<br><b>${esc(par.firma_nombre)}</b>${par.firma_cargo ? ' · ' + esc(par.firma_cargo) : ''}` : ''}</div></div>
    <div class="pie"><span>Generado el ${fdt(new Date().toISOString())}${S.yo ? ' por ' + esc(S.yo.nombre) : S.user?.email ? ' por ' + esc(S.user.email) : ''}</span><span>Mi Planilla · ${DUENO_SISTEMA}</span></div>`;

function excelPlanilla(per, calc) {
  if (!window.XLSX) return toast('Cargando librería de Excel, intenta de nuevo', true);
  const filas = calc.map((c, i) => { const r = resumenFila(c); return { '#': i + 1, 'Nombre': c.nombre, 'Planilla (ingresos)': +c.total_ingresos, 'Adelantos': r.adel, 'Préstamos': r.pres, 'Otras deducciones': +r.otras.toFixed(2), 'Deducciones': +c.total_deducciones, 'Monto a pagar': +c.neto, 'Método de pago': c.metodo_pago, 'Banco': c.banco || '', 'Cuenta': c.cuenta || '' }; });
  const det = [];
  calc.forEach(c => {
    (c.ingresos || []).forEach(x => det.push({ Nombre: c.nombre, Tipo: 'Ingreso', Concepto: x.concepto, Tiempo: x.tiempo ?? '', Tarifa: x.tarifa ?? '', Monto: +x.monto, Saldo: '', Detalle: x.detalle || '' }));
    (c.deducciones || []).forEach(x => det.push({ Nombre: c.nombre, Tipo: 'Deducción', Concepto: x.concepto, Tiempo: '', Tarifa: '', Monto: +x.monto, Saldo: x.saldo ?? '', Detalle: x.detalle || '' }));
  });
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(filas); ws['!cols'] = [{ wch: 4 }, { wch: 34 }, ...Array(6).fill({ wch: 14 }), { wch: 15 }, { wch: 12 }, { wch: 18 }];
  XLSX.utils.book_append_sheet(wb, ws, 'Planilla');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(det), 'Detalle');
  XLSX.writeFile(wb, `Planilla_${per.codigo}.xlsx`);
}

/* ---------- asistencia ---------- */
const MARCAS = { T: 'Trabajado', F: 'Falta', V: 'Vacaciones', I: 'Incapacidad', P: 'Permiso sin goce', L: 'Libre / permiso con goce', R: 'Feriado (día libre pagado)', N: 'No laboraba (antes de ingresar o después de la baja)' };
const HORAS_MARCA = { T: 8, F: 0, V: 8, I: 8, P: 0, L: 8, R: 8, N: 0 };
async function tabAsistencia(cont, per, recargar = () => vPeriodo(per.id, 'asistencia')) {
  const abierta = per.estado === 'abierta';
  const datos = await q(sb.rpc('pl_asistencia_periodo', { p_periodo: per.id }));
  const rows = datos.registros, emps = datos.empleados;
  const dias = []; for (let d = pf(per.fecha_inicio); d <= pf(per.fecha_fin); d.setDate(d.getDate() + 1)) dias.push(new Date(d));
  const map = {}; rows.forEach(r => map[r.empleado_id + '|' + r.fecha] = r);
  const ids = [...new Set(rows.map(r => r.empleado_id))];
  const lista = emps.filter(e => ids.includes(e.id));
  const horasPag = id => { const rs = rows.filter(r => r.empleado_id === id); return Math.max(0, 120 - rs.reduce((a, r) => a + Math.max(0, 8 - +r.horas), 0)); };
  cont.innerHTML = `
    <div class="leyenda">${Object.entries(MARCAS).map(([k, t]) => `<span><i class="m m-${k}" style="width:22px;height:22px;cursor:default">${k}</i>${t}</span>`).join('')}
      <span><i class="m m-T parcial" style="width:22px;height:22px;cursor:default"></i>Horas parciales / llegada tarde</span><span><i class="m m-T extra" style="width:22px;height:22px;cursor:default"></i>Horas extra / feriado</span></div>
    ${lista.length ? `<div class="tscroll"><table class="grid-asis">
      <thead><tr><th class="n">Empleado</th>${dias.map(d => `<th class="${d.getDay() === 0 ? 'dom' : ''}">${DIAS[d.getDay()]}<br>${d.getDate()}</th>`).join('')}<th>Horas</th></tr></thead>
      <tbody>${lista.map(e => `<tr><td class="n" title="${esc(e.nombre)}">${esc(corto(e.nombre))}</td>${dias.map(d => { const r = map[e.id + '|' + iso(d)]; if (!r) return `<td><button class="m m-N" data-e="${e.id}" data-f="${iso(d)}" ${abierta ? '' : 'disabled'}>·</button></td>`; const parcial = (r.marca === 'T' && +r.horas < 8) || r.minutos_tarde > 0; const extra = +r.horas_extra > 0 || r.feriado; return `<td><button class="m m-${r.marca} ${parcial ? 'parcial' : ''} ${extra ? 'extra' : ''}" data-e="${e.id}" data-f="${r.fecha}" title="${esc(MARCAS[r.marca])} · ${N(r.horas)} h${r.minutos_tarde ? ' · ' + r.minutos_tarde + ' min tarde' : ''}${+r.horas_extra ? ' · ' + N(r.horas_extra) + ' h extra' : ''}${r.nota ? ' · ' + r.nota : ''}" ${abierta ? '' : 'disabled'}>${r.marca === 'T' && +r.horas < 8 ? N(r.horas) : r.marca}</button></td>`; }).join('')}<td class="h">${N(horasPag(e.id))}</td></tr>`).join('')}</tbody>
    </table></div>` : `<div class="vacio"><b>No hay asistencia generada</b>Genera 8 horas diarias para los empleados con salario.</div>`}
    ${abierta ? `<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn borde sm" id="gen">Agregar empleados faltantes</button><button class="btn borde sm" id="ferall">Marcar feriado a todos</button><span class="small muted" style="align-self:center">Toca un día para marcar falta, vacaciones, horas extra o llegada tarde. La quincena se paga sobre 120 horas.</span></div>` : ''}`;
  $('#gen', cont) && ($('#gen', cont).onclick = async () => { try { const n = await q(sb.rpc('pl_generar_asistencia', { p_periodo: per.id })); toast(n ? `${n} días agregados` : 'No faltaba nadie'); recargar(); } catch (e) { toast(errMsg(e), true); } });
  if (!abierta) return;
  $('#ferall', cont) && ($('#ferall', cont).onclick = () => {
    const h = hoja('Marcar feriado a todos', `<form><label class="f">Día del feriado<input class="inp" type="date" name="fecha" min="${per.fecha_inicio}" max="${per.fecha_fin}" required></label>
      <label class="f">Nombre del feriado<input class="inp" name="nombre" required maxlength="80" placeholder="Ej.: Feriado Morazánico"></label>
      <p class="tiny muted" style="margin:0">Ese día queda como <b>R · Feriado (día libre pagado)</b> para todos los empleados de esta planilla. Se respetan vacaciones, incapacidades y los que aún no laboraban. Si alguien trabajó el feriado, edita su día y marca "Feriado trabajado".</p>
      <div class="pie"><button class="btn pri">Marcar feriado</button></div></form>`);
    $('form', h.el).onsubmit = async ev => {
      ev.preventDefault(); const x = formData(ev.target); const b = $('button.pri', ev.target); b.disabled = true; let n = 0;
      try {
        for (const e of lista) {
          const r = map[e.id + '|' + x.fecha]; if (r && ['V', 'I', 'N'].includes(r.marca)) continue;
          await q(sb.rpc('pl_guardar_asistencia', { p_periodo: per.id, p_empleado: e.id, p_fecha: x.fecha, p_marca: 'R', p_horas: 8, p_minutos_tarde: 0, p_horas_extra: +(r?.horas_extra || 0), p_feriado: false, p_nota: 'Feriado: ' + x.nombre.trim() })); n++;
        }
        h.cerrar(); toast(`Feriado marcado a ${n} empleados`); recargar();
      } catch (er) { b.disabled = false; toast(errMsg(er), true); }
    };
  });
  $$('button.m[data-e]', cont).forEach(b => b.onclick = () => editarDia(per, lista.find(e => e.id === b.dataset.e), b.dataset.f, map[b.dataset.e + '|' + b.dataset.f], recargar));
}

function editarDia(per, emp, fecha, r, recargar) {
  r = r || { marca: 'T', horas: 8, minutos_tarde: 0, horas_extra: 0, feriado: false, nota: '' };
  const d = pf(fecha);
  const h = hoja(`${corto(emp.nombre)} · ${['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][d.getDay()]} ${d.getDate()}`, `<form>
    <div class="marcas">${Object.entries(MARCAS).map(([k, t]) => `<button type="button" data-m="${k}" class="${r.marca === k ? 'on' : ''}"><i class="m m-${k}" style="cursor:inherit">${k}</i>${t}</button>`).join('')}</div>
    <input type="hidden" name="marca" value="${r.marca}">
    <div class="row2"><label class="f">Horas pagadas del día<input class="inp" type="number" step="0.5" min="0" max="8" name="horas" value="${+r.horas}"></label>
      <label class="f">Minutos tarde<input class="inp" type="number" min="0" step="1" name="minutos_tarde" value="${r.minutos_tarde || 0}"></label></div>
    <div class="row2"><label class="f">Horas extra<input class="inp" type="number" min="0" step="0.5" name="horas_extra" value="${+r.horas_extra || 0}"></label>
      <label class="chk" style="align-self:end;padding-bottom:10px"><input type="checkbox" name="feriado" ${r.feriado ? 'checked' : ''}>Feriado trabajado (pago doble)</label></div>
    <label class="f">Nota<input class="inp" name="nota" value="${esc(r.nota || '')}" placeholder="Ej.: cita médica, entró a trabajar este día"></label>
    <div class="pie"><button class="btn pri">Guardar día</button></div></form>`);
  const f = $('form', h.el);
  $$('[data-m]', h.el).forEach(b => b.onclick = () => { $$('[data-m]', h.el).forEach(x => x.classList.toggle('on', x === b)); f.marca.value = b.dataset.m; f.horas.value = HORAS_MARCA[b.dataset.m]; });
  f.onsubmit = async e => {
    e.preventDefault(); const x = formData(f);
    try {
      await q(sb.rpc('pl_guardar_asistencia', { p_periodo: per.id, p_empleado: emp.id, p_fecha: fecha, p_marca: x.marca, p_horas: +x.horas || 0, p_minutos_tarde: +x.minutos_tarde || 0, p_horas_extra: +x.horas_extra || 0, p_feriado: !!x.feriado, p_nota: x.nota || null }));
      h.cerrar(); recargar();
    } catch (er) { toast(errMsg(er), true); }
  };
}

    if (f.cantidad.value === '') { f.monto.value = ''; return; }

      ${+c.salario_mensual ? `<div class="cp-dato"><span>Salario mensual</span><span>${L(c.salario_mensual)}</span></div>` : ''}
      ${c.fecha_ingreso ? `<div class="cp-dato"><span>Fecha de ingreso</span><span>${fc(c.fecha_ingreso)}</span></div>` : ''}
      <div class="cp-dato"><span>Forma de pago</span><span>${c.metodo_pago === 'EFECTIVO' ? 'Efectivo' : 'Transferencia ' + esc(c.banco || '')}${c.cuenta ? ' · ' + esc(c.cuenta) : ''}</span></div>

        <div class="cp-tot"><span>Total ingresos</span><span class="num">${L(c.total_ingresos)}</span></div></div>

// Exporta un elemento (comprobante) como imagen PNG; en el teléfono abre "Compartir" (WhatsApp, galería…)
async function exportarImagen(el, nombre, fondo = '#F7FAFF') {
  if (!window.html2canvas) return toast('Cargando, intenta de nuevo en un momento', true);
  if (!el) return;
  toast('Generando imagen…');
  try {
    await document.fonts?.ready;
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: fondo, useCORS: true, logging: false, windowWidth: Math.max(el.scrollWidth, 1300) });
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    const archivo = new File([blob], `${nombre}.png`, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [archivo] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) {
      try { await navigator.share({ files: [archivo], title: nombre }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = archivo.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) { toast('No se pudo generar la imagen: ' + errMsg(e), true); }
}
const nombreArchivo = (c, numero) => `Comprobante ${numero || c.periodo?.codigo || ''} ${corto(c.nombre)}`.replace(/[\\/:*?"<>|]+/g, '').trim();

function imprimir(items, per) {
  $('#imprimir').innerHTML = items.map(({ c, numero, recibido }) => htmlComprobante(c, { numero, recibido, borrador: per?.estado === 'abierta' })).join('');
  setTimeout(() => window.print(), 60);
}

function textoWA(c) {
  const p = c.periodo || {};
  const l = [`*${empNombre() || 'Mi Planilla'} · Comprobante de pago*`, `${c.nombre}`, `${p.nombre} (${fc(p.fecha_inicio)} al ${fc(p.fecha_fin)})`, '', '*Ingresos*'];
  (c.ingresos || []).forEach(x => l.push(`• ${x.concepto}: ${L(x.monto)}`));
  l.push(`Total: ${L(c.total_ingresos)}`, '', '*Deducciones*');
  (c.deducciones || []).forEach(x => l.push(`• ${x.concepto}: ${L(x.monto)}${x.saldo != null ? ` (saldo ${L(x.saldo)})` : ''}`));
  l.push(`Total: ${L(c.total_deducciones)}`, '', `*Total a pagar: ${L(c.neto)}*`);
  return l.join('\n');
}
function compartirWA(c, tel) {
  const t = encodeURIComponent(textoWA(c));
  const n = (tel || '').replace(/\D/g, '');
  window.open(n ? `https://wa.me/${n.length === 8 ? '504' + n : n}?text=${t}` : `https://wa.me/?text=${t}`, '_blank');
}

/* ===================== EMPLEADOS ===================== */
async function vEmpleados() {
  cargando();
  const [emps, pers] = await Promise.all([
    q(sb.from('pl_empleados').select('*')),
    q(sb.from('pl_periodos').select('id,nombre,fecha_fin').eq('tipo', 'comisiones').eq('estado', 'cerrada').order('fecha_fin', { ascending: false }).limit(3))]);
  // Promedio de comisiones: lo ganado en los últimos 3 meses de comisiones cerrados ÷ número de meses
  const perIds = pers.map(p => p.id);
  const comps = perIds.length ? await q(sb.from('pl_comprobantes').select('empleado_id,neto,datos').in('periodo_id', perIds).eq('anulado', false)) : [];
  // ganado = neto + adelantos/vales/préstamos (ya recibidos); penalizaciones y otras deducciones sí restan
  const sumCom = {}; comps.forEach(c => sumCom[c.empleado_id] = (sumCom[c.empleado_id] || 0) + ganado(c));
  const nMeses = perIds.length || 1;
  const todos = emps.map(e => ({ ...e, prom: Math.round((sumCom[e.id] || 0) / nMeses) }));
  const filas = todos.filter(e => e.tipo_vinculo !== 'colaborador'), colabs = todos.filter(e => e.tipo_vinculo === 'colaborador').sort((a, b) => (b.activo - a.activo) || a.nombre.localeCompare(b.nombre));
  filas.forEach(e => e.total = (+e.salario_mensual || 0) + e.prom);
  let orden = { k: 'nombre', dir: 1 };
  try { orden = JSON.parse(sessionStorage.getItem('pl_emp_orden')) || orden; } catch (_) { }
  const COLS = [
    ['numero', '#', 'num'], ['nombre', 'Nombre', 'txt'], ['cargo', 'Cargo', 'txt'], ['salario_mensual', 'Salario mensual', 'num', 'r'],
    ['prom', 'Prom. comisiones', 'num', 'r'], ['total', 'Total mensual', 'num', 'r'], ['recibe', 'Recibe', 'txt'], ['usuario', 'Usuario', 'txt']];
  const valor = (e, k) => k === 'recibe' ? `${e.recibe_salario ? 'Salario' : ''}${e.recibe_comisiones ? ' Comisiones' : ''}${e.recibe_combustible ? ' Combustible' : ''}${e.recibe_depreciacion ? ' Depreciación' : ''}` : k === 'usuario' ? (e.usuario || '') : e[k];
  const act = filas.filter(e => e.activo);
  const tSal = act.reduce((a, e) => a + (+e.salario_mensual || 0), 0), tCom = act.reduce((a, e) => a + e.prom, 0);
  const conComb = act.filter(e => e.recibe_combustible), conDep = act.filter(e => e.recibe_depreciacion);
  const tDep = conDep.reduce((a, e) => a + (+e.depreciacion_mensual || 0), 0);
  const m = shell(`<div class="top"><div><h1>Empleados</h1><div class="muted small">${act.length} activos · ${pers.length ? `promedio de comisiones de ${pers.length === 1 ? '1 mes' : `${pers.length} meses`}: ${pers.map(p => p.nombre.replace(/^Comisiones /, '')).reverse().join(', ')}` : 'aún no hay meses de comisiones cerrados'}</div></div><div class="acc"><a class="btn borde" href="#/tiempo">Vacaciones y horas</a><a class="btn borde" href="#/decimos">Proyección de décimos</a><button class="btn pri" id="nuevo">${ICON.mas}Agregar empleado</button></div></div>
    <div class="tscroll"><table class="t" id="temp"><thead><tr>${COLS.map(([k, t, , al]) => `<th class="${al || ''} ordenable" data-k="${k}" aria-sort="none">${t}<span class="flecha"></span></th>`).join('')}</tr></thead><tbody></tbody>
    <tfoot><tr><td></td><td>Total (${act.length} activos)</td><td></td><td class="r">${L(tSal)}</td><td class="r">${L(tCom)}</td><td class="r">${L(tSal + tCom)}</td><td colspan="2" class="small muted" style="font-weight:500">Planilla quincenal: ${L(tSal / 2)}${conComb.length ? `<br>Combustible (efectivo): ${conComb.length}` : ''}${conDep.length ? `<br>Depreciación día 30: ${tDep ? L(tDep) : conDep.length + ' empleados'}` : ''}</td></tr></tfoot></table></div>
    ${colabs.length ? `<h2 style="margin:24px 0 6px">Colaboradores externos</h2><p class="small muted" style="margin:0 0 10px">No son empleados directos: solo cobran bonificación en la planilla de comisiones (día 15). No entran en vacaciones, horas extra, feriados, décimos, asistencia ni en los totales de arriba.</p>
    <div class="tscroll"><table class="t"><thead><tr><th>Nombre</th><th class="r">Bonificación promedio</th><th>Pago</th></tr></thead><tbody>${colabs.map(e => `<tr class="click" data-e="${e.id}" style="${e.activo ? '' : 'opacity:.5'}"><td><b>${esc(e.nombre)}</b>${e.activo ? '' : ' <span class="chip gris">inactivo</span>'}</td><td class="r">${e.prom ? L(e.prom) : '—'}</td><td class="small muted">${e.metodo_pago === 'EFECTIVO' ? 'Efectivo' : 'Transferencia ' + esc(e.banco || '')}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Total (${colabs.filter(e => e.activo).length})</td><td class="r">${L(colabs.filter(e => e.activo).reduce((a, e) => a + e.prom, 0))}</td><td></td></tr></tfoot></table></div>` : ''}`);
  const pintar = () => {
    const tipo = COLS.find(c => c[0] === orden.k)?.[2];
    const lista = [...filas].sort((a, b) => {
      if (a.activo !== b.activo) return a.activo ? -1 : 1; // inactivos siempre al final
      const x = valor(a, orden.k), y = valor(b, orden.k);
      const r = tipo === 'num' ? (+x || 0) - (+y || 0) : String(x || '').localeCompare(String(y || ''), 'es', { sensitivity: 'base' });
      return r * orden.dir || a.nombre.localeCompare(b.nombre);
    });
    $('#temp tbody', m).innerHTML = lista.map(e => `<tr class="click" data-e="${e.id}" style="${e.activo ? '' : 'opacity:.5'}"><td class="muted">${e.numero}</td><td><b>${esc(e.nombre)}</b>${e.activo ? '' : e.fecha_baja ? ` <span class="chip red">baja ${fc(e.fecha_baja)}</span>` : ' <span class="chip gris">inactivo</span>'}</td><td class="muted">${esc(e.cargo || '')}</td><td class="r">${+e.salario_mensual ? L(e.salario_mensual) : '—'}</td><td class="r">${e.prom ? L(e.prom) : '—'}</td><td class="r num">${e.total ? L(e.total) : '—'}</td><td><div class="chips">${e.recibe_salario ? '<span class="chip">Salario</span>' : ''}${e.recibe_comisiones ? '<span class="chip warn">Comisiones</span>' : ''}${e.recibe_combustible ? '<span class="chip comb" title="Se paga aparte, en efectivo, la misma fecha de la planilla">Combustible</span>' : ''}${e.recibe_depreciacion ? `<span class="chip dep" title="Se paga el día 30 de cada mes">Depreciación${+e.depreciacion_mensual ? ' ' + L(e.depreciacion_mensual) : ''}</span>` : ''}</div></td><td class="small">${e.user_id ? `<span class="chip ok">${esc(e.usuario || 'vinculado')}</span>` : '<span class="muted">Sin usuario</span>'}</td></tr>`).join('');
    $$('#temp th[data-k]', m).forEach(th => { const on = th.dataset.k === orden.k; th.setAttribute('aria-sort', on ? (orden.dir > 0 ? 'ascending' : 'descending') : 'none'); th.querySelector('.flecha').textContent = on ? (orden.dir > 0 ? ' ▲' : ' ▼') : ''; });
    $$('tr[data-e]', m).forEach(tr => tr.onclick = () => location.hash = `#/empleado/${tr.dataset.e}`);
  };
  $$('#temp th[data-k]', m).forEach(th => th.onclick = () => {
    const k = th.dataset.k; const num = COLS.find(c => c[0] === k)[2] === 'num';
    orden = orden.k === k ? { k, dir: -orden.dir } : { k, dir: num ? -1 : 1 }; // montos: primero de mayor a menor
    try { sessionStorage.setItem('pl_emp_orden', JSON.stringify(orden)); } catch (_) { }
    pintar();
  });
  pintar();
  $$('tr[data-e]', m).forEach(tr => { if (!tr.closest('#temp')) tr.onclick = () => location.hash = `#/empleado/${tr.dataset.e}`; });
  $('#nuevo', m).onclick = () => editarEmpleado(null);
}

    const row = { tipo_vinculo: x.tipo_vinculo === 'colaborador' ? 'colaborador' : 'empleado', nombre: x.nombre.trim(), identidad: x.identidad || null, cargo: x.cargo || null, area: x.area || null, telefono: x.telefono || null, salario_mensual: +x.salario_mensual || 0, seguro_medico: +x.seguro_medico || 0, fecha_ingreso: x.fecha_ingreso || null, recibe_salario: !!x.recibe_salario, recibe_comisiones: !!x.recibe_comisiones, recibe_combustible: !!x.recibe_combustible, recibe_depreciacion: !!x.recibe_depreciacion, depreciacion_mensual: x.recibe_depreciacion ? (+x.depreciacion_mensual || 0) : 0, activo: !!x.activo, metodo_pago: x.metodo_pago, banco: x.banco || null, cuenta: x.cuenta || null };
    try {
      if (e.id) { await q(sb.from('pl_empleados').update(row).eq('id', e.id)); h.cerrar(); toast('Cambios guardados'); ruta(); }
      else { const n = await q(sb.from('pl_empleados').insert(row).select().single()); h.cerrar(); toast('Empleado agregado'); location.hash = `#/empleado/${n.id}`; }
    } catch (er) { toast(errMsg(er), true); }
  };
}

async function fnUsuarios(body) {
  const { data, error } = await sb.functions.invoke('planilla-usuarios', { body });
  if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch (_) { } throw new Error(m); }
  if (data?.error) throw new Error(data.error);
  return data;
}

/* ===================== PRÉSTAMOS ===================== */
function itemPrestamo(p, conBoton) {
  const pct = Math.min(100, Math.max(0, (+p.pagado / +p.monto_total) * 100));
  const cuotas = +p.saldo > 0 ? Math.ceil(+p.saldo / +p.cuota) : 0;
  return `<div class="item" ${conBoton ? `data-p="${p.id}"` : ''} style="display:block">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><div class="t">${esc(p.codigo)} ${p.pl_empleados ? `· ${esc(p.pl_empleados.nombre)} ${btnCopiar(p.pl_empleados.nombre, 'Copiar nombre')}` : ''}</div><div class="s">Cuota ${L(p.cuota)} por ${p.aplica_en === 'comisiones' ? 'pago de comisiones' : 'quincena'}${cuotas ? ` · faltan ${cuotas} cuota${cuotas > 1 ? 's' : ''}` : ''}</div></div>
      <div style="text-align:right">${+p.saldo <= 0.004 ? '<span class="chip ok">Pagado</span>' : (p.activo ? `<div class="num">${L(p.saldo)}</div><div class="tiny muted">saldo</div>` : '<span class="chip gris">Pausado</span>')}</div></div>
    <div class="barra"><i style="width:${pct}%"></i></div>
    <div class="tiny muted" style="margin-top:4px">Pagado ${L(p.pagado)} de ${L(p.monto_total)}</div></div>`;
}

async function vPrestamos() {
  cargando();
  const [pres0, emps] = await Promise.all([q(sb.from('pl_prestamos_saldo').select('*').order('creado_en')), q(sb.from('pl_empleados').select('id,nombre'))]);
  const pres = pres0.map(p => ({ ...p, pl_empleados: { nombre: emps.find(e => e.id === p.empleado_id)?.nombre || '' } }));
  const act = pres.filter(p => +p.saldo > 0.004);
  const m = shell(`<div class="top"><div><h1>Préstamos a empleados</h1><div class="muted small">${act.length} con saldo · ${L(act.reduce((a, p) => a + +p.saldo, 0))} por recuperar · ${L(act.filter(p => p.activo && p.aplica_en === 'salario').reduce((a, p) => a + Math.min(+p.cuota, +p.saldo), 0))} por quincena</div></div><div class="acc"><button class="btn pri" id="nuevo">${ICON.mas}Nuevo préstamo</button></div></div>
    <div class="segm" style="margin-bottom:12px"><button class="on" data-f="act">Con saldo</button><button data-f="todos">Todos</button></div>
    <div id="lp"></div>`);
  const pintar = f => { const l = f === 'act' ? act : pres; $('#lp', m).innerHTML = l.length ? `<div class="lista">${l.sort((a, b) => a.pl_empleados.nombre.localeCompare(b.pl_empleados.nombre)).map(p => itemPrestamo(p, true)).join('')}</div>` : '<div class="vacio"><b>Sin préstamos</b>Registra el préstamo y su cuota; se descuenta solo en cada planilla.</div>'; $$('[data-p]', m).forEach(b => b.onclick = () => detallePrestamo(pres.find(p => p.id === b.dataset.p))); };
  $$('.segm button', m).forEach(b => b.onclick = () => { $$('.segm button', m).forEach(x => x.classList.toggle('on', x === b)); pintar(b.dataset.f); });
  pintar('act');
  $('#nuevo', m).onclick = () => editarPrestamo(null);
}

async function editarPrestamo(p, empId) {
  const emps = await empleadosActivos();
  p = p || { empleado_id: empId || '', codigo: '', descripcion: '', fecha: iso(hoyHN()), monto_total: '', cuota: '', aplica_en: 'salario', activo: true };
  const h = hoja(p.id ? 'Editar préstamo' : 'Nuevo préstamo', `<form>
    <label class="f">Empleado<select class="inp" name="empleado_id" required><option value="">Elegir…</option>${emps.filter(e => e.activo || e.id === p.empleado_id).map(e => `<option value="${e.id}" ${e.id === p.empleado_id ? 'selected' : ''}>${esc(e.nombre)}</option>`).join('')}</select></label>
    <div class="row2"><label class="f">Código del préstamo<input class="inp" name="codigo" value="${esc(p.codigo)}" required placeholder="NP-000000"></label><label class="f">Fecha<input class="inp" type="date" name="fecha" value="${p.fecha || ''}"></label></div>
    <div class="row2"><label class="f">Deuda total (L)<input class="inp" type="number" step="0.01" min="0.01" name="monto_total" value="${p.monto_total}" required></label><label class="f">Cuota por pago (L)<input class="inp" type="number" step="0.01" min="0.01" name="cuota" value="${p.cuota}" required></label></div>
    <label class="f">Se descuenta en<select class="inp" name="aplica_en"><option value="salario" ${p.aplica_en === 'salario' ? 'selected' : ''}>Planilla de salario (cada quincena)</option><option value="comisiones" ${p.aplica_en === 'comisiones' ? 'selected' : ''}>Pago de comisiones (mensual)</option></select></label>
    <label class="f">Descripción<input class="inp" name="descripcion" value="${esc(p.descripcion || '')}" placeholder="Ej.: préstamo nivelado"></label>
    <label class="chk"><input type="checkbox" name="activo" ${p.activo ? 'checked' : ''}>Descontar en planilla (desmarca para pausar)</label>
    <div class="pie">${p.id ? '<button type="button" class="btn rojo" id="del">Eliminar</button>' : ''}<button class="btn pri">${p.id ? 'Guardar cambios' : 'Registrar préstamo'}</button></div></form>`);
  $('form', h.el).onsubmit = async ev => {
    ev.preventDefault(); const x = formData(ev.target);
    const row = { empleado_id: x.empleado_id, codigo: x.codigo.trim(), fecha: x.fecha || null, monto_total: +x.monto_total, cuota: +x.cuota, aplica_en: x.aplica_en, descripcion: x.descripcion || null, activo: !!x.activo };
    try { if (p.id) await q(sb.from('pl_prestamos').update(row).eq('id', p.id)); else await q(sb.from('pl_prestamos').insert(row)); h.cerrar(); toast(p.id ? 'Cambios guardados' : 'Préstamo registrado'); ruta(); } catch (er) { toast(errMsg(er), true); }
  };
  $('#del', h.el) && ($('#del', h.el).onclick = async () => { h.cerrar(); if (!await confirmar('Eliminar préstamo', 'Se borrará el préstamo y su historial de abonos.', 'Eliminar', true)) return; try { await q(sb.from('pl_prestamos').delete().eq('id', p.id)); toast('Préstamo eliminado'); ruta(); } catch (er) { toast(errMsg(er), true); } });
}

async function detallePrestamo(p) {
  const pagos = await q(sb.from('pl_prestamo_pagos').select('*, pl_periodos(nombre)').eq('prestamo_id', p.id).eq('anulado', false).order('fecha'));
  const h = hoja(`Préstamo ${p.codigo}`, `${itemPrestamo(p, false)}
    <h3 style="margin:16px 0 6px">Abonos</h3>
    ${pagos.length ? `<table class="t"><tbody>${pagos.map(g => `<tr><td>${fc(g.fecha)}</td><td class="muted small">${esc(g.pl_periodos?.nombre || g.nota || 'Abono directo')}</td><td class="r num">${L(g.monto)}</td><td style="width:30px">${g.periodo_id ? '' : `<button class="btn sm rojo" data-del="${g.id}" aria-label="Eliminar abono">×</button>`}</td></tr>`).join('')}</tbody></table>` : '<p class="small muted">Sin abonos todavía. Se registran solos al cerrar cada planilla.</p>'}
    <div class="pie" style="margin-top:14px"><button class="btn" id="abono">Registrar abono directo</button><button class="btn borde" id="edit">Editar préstamo</button></div>`);
  $('#edit', h.el).onclick = () => { h.cerrar(); editarPrestamo(p); };
  $$('[data-del]', h.el).forEach(b => b.onclick = async () => { try { await q(sb.from('pl_prestamo_pagos').delete().eq('id', b.dataset.del)); h.cerrar(); toast('Abono eliminado'); ruta(); } catch (er) { toast(errMsg(er), true); } });
  $('#abono', h.el).onclick = () => {
    h.cerrar();
    const h2 = hoja('Abono directo', `<form><p class="small muted" style="margin:0">Pago hecho fuera de planilla (en caja o depósito).</p><div class="row2"><label class="f">Fecha<input class="inp" type="date" name="fecha" value="${iso(hoyHN())}" required></label><label class="f">Monto (L)<input class="inp" type="number" step="0.01" min="0.01" max="${+p.saldo}" name="monto" required></label></div><label class="f">Nota<input class="inp" name="nota" placeholder="Ej.: pago en caja"></label><div class="pie"><button class="btn pri">Registrar abono</button></div></form>`);
    $('form', h2.el).onsubmit = async ev => { ev.preventDefault(); const x = formData(ev.target); try { await q(sb.from('pl_prestamo_pagos').insert({ prestamo_id: p.id, fecha: x.fecha, monto: +x.monto, nota: x.nota || 'Abono directo' })); h2.cerrar(); toast('Abono registrado'); ruta(); } catch (er) { toast(errMsg(er), true); } };
  };
}

/* ===================== ADELANTOS ===================== */
async function vAdelantos() {
  cargando();
  const ad = await q(sb.from('pl_adelantos').select('*, pl_empleados(nombre), pl_periodos(nombre,estado)').order('fecha', { ascending: false }).limit(300));
  const pend = ad.filter(a => !a.periodo_id && a.estado === 'aprobado');
  const porAut = ad.filter(a => a.estado === 'pendiente').length;
  const m = shell(`<div class="miga"><a href="#/mis-solicitudes">Mis solicitudes</a></div><div class="top"><div><h1>Adelantos</h1><div class="muted small">Se descuentan en la planilla asignada${porAut ? ` · <a href="#/solicitudes">${porAut} por autorizar</a>` : ''}</div></div><div class="acc"><button class="btn pri" id="nuevo">${ICON.mas}Registrar adelanto</button></div></div>
    ${pend.length ? `<div class="err" style="background:#FFF6CC;color:#6B5200;margin-bottom:12px">${pend.length} adelanto${pend.length > 1 ? 's' : ''} sin planilla asignada (${L(pend.reduce((s, a) => s + +a.monto, 0))}). Asígnalos para que se descuenten.</div>` : ''}
    ${ad.length ? `<div class="tscroll"><table class="t"><thead><tr><th>Fecha</th><th>Empleado</th><th>Se descuenta en</th><th class="r">Monto</th></tr></thead><tbody>
      ${ad.map(a => `<tr class="click" data-a="${a.id}"><td>${fc(a.fecha)}</td><td><b>${esc(a.pl_empleados?.nombre)}</b>${a.descripcion && a.descripcion !== 'Adelanto de salario' ? `<div class="tiny muted">${esc(a.descripcion)}</div>` : ''}</td><td>${a.estado !== 'aprobado' ? chipEstado(a.estado) : a.pl_periodos ? `${esc(a.pl_periodos.nombre)} ${a.pl_periodos.estado === 'cerrada' ? '<span class="chip ok">descontado</span>' : ''}` : '<span class="chip warn">Sin planilla</span>'}<div class="tiny muted">${a.tipo === 'comisiones' ? 'Comisiones' : 'Salario'}${a.origen === 'empleado' ? (a.automatico ? ' · pedido por la app (automático)' : ' · pedido por la app') : ''}</div></td><td class="r num">${L(a.monto)}${a.estado === 'aprobado' ? (a.desembolsado_en ? '<div class="tiny" style="color:#0F7A43">entregado</div>' : '<div class="tiny" style="color:#8A6A00">por entregar</div>') : ''}</td></tr>`).join('')}
      </tbody></table></div>` : '<div class="vacio"><b>Sin adelantos</b>Registra los adelantos a medida que se entregan.</div>'}`);
  $('#nuevo', m).onclick = () => editarAdelanto(null, null, vAdelantos);
  $$('tr[data-a]', m).forEach(tr => tr.onclick = () => { const a = ad.find(x => x.id === tr.dataset.a); if (a.estado === 'pendiente') { location.hash = '#/solicitudes'; return; } if (a.estado === 'rechazado') return toast('Este adelanto fue rechazado', true); if (a.pl_periodos?.estado === 'cerrada') return toast('Ya se descontó en una planilla cerrada', true); editarAdelanto(a, null, vAdelantos); });
}

/* ===================== AJUSTES ===================== */
async function vAjustes() {
  cargando();
  const [cs, adms, sups, conCuenta] = await Promise.all([
    q(sb.from('pl_conceptos').select('*').order('tipo').order('orden')),
    q(sb.from('pl_admins').select('user_id,autoriza')),
    q(sb.from('pl_supervisores').select('user_id')),
    q(sb.from('pl_empleados').select('id,nombre,user_id,usuario').not('user_id', 'is', null).order('nombre'))]);

  const IDENT = ['empresa_nombre', 'empresa_logo'];

  const valSw = k => String(parTodos.find(x => x.clave === k)?.valor ?? (SW[k][2] || 'si')).trim().toLowerCase() === 'si';
  const [plArea, empsA] = await Promise.all([q(sb.from('pl_plantillas').select('*').is('empleado_id', null).order('area').order('orden')), q(sb.from('pl_empleados').select('area,cargo'))]);
  S.areas = empsA.map(x => x.area || x.cargo).filter(Boolean);
  S.conceptos = null;
  const grupo = (t, titulo) => `<div class="panel"><h3 style="margin-bottom:8px">${titulo}</h3><table class="t"><tbody>${cs.filter(c => c.tipo === t).map(c => `<tr class="click" data-c="${c.id}" style="${c.activo ? '' : 'opacity:.45'}"><td>${esc(c.nombre)}</td><td class="small muted">${{ salario: 'Salario', comisiones: 'Comisiones', ambos: 'Ambas' }[c.aplica]}</td></tr>`).join('')}</tbody></table></div>`;
  const m = shell(`<div class="top"><div><h1>Ajustes</h1><div class="muted small">Catálogo de conceptos para ingresos y deducciones</div></div><div class="acc"><button class="btn pri" id="nuevo">${ICON.mas}Nuevo concepto</button></div></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px">${grupo('ingreso', 'Ingresos')}${grupo('deduccion', 'Deducciones')}</div>
    <div class="panel" style="margin-top:14px"><h3 style="margin-bottom:4px">Identidad de la empresa</h3><p class="small muted" style="margin:0 0 10px">El nombre y el logo salen en la pantalla de ingreso, el menú, los comprobantes, la planilla en imagen, las constancias y las liquidaciones.</p>

          <p class="tiny muted" style="margin:8px 0 0">PNG con fondo transparente o JPG, horizontal de preferencia. Se ajusta solo al tamaño adecuado.</p></div>
        <div><div class="small muted" style="margin-bottom:6px">Vista previa</div><div class="logo-prev" id="logoprev"></div></div>
        <div style="grid-column:1/-1;display:flex;justify-content:flex-end"><button class="btn pri">Guardar identidad</button></div></form>
      <p class="tiny muted" style="margin:12px 0 0">Mi Planilla es un sistema de ${DUENO_SISTEMA}.</p></div>

  $$('[data-adm]', m).forEach(ch => ch.onchange = async () => {
    try {
      if (ch.checked) await q(sb.from('pl_admins').insert({ user_id: ch.dataset.adm }));
      else await q(sb.from('pl_admins').delete().eq('user_id', ch.dataset.adm));
      toast(ch.checked ? 'Acceso de administrador dado' : 'Acceso de administrador quitado'); vAjustes();
    } catch (er) { ch.checked = !ch.checked; toast(errMsg(er), true); }
  });
  $$('[data-sup]', m).forEach(ch => ch.onchange = async () => {
    try {
      if (ch.checked) await q(sb.from('pl_supervisores').insert({ user_id: ch.dataset.sup }));
      else await q(sb.from('pl_supervisores').delete().eq('user_id', ch.dataset.sup));
      toast(ch.checked ? 'Ahora es supervisor de asistencia' : 'Ya no es supervisor de asistencia');

function pagosFiltrables(cont, comps, { link, clave = 'pl_pagos_f' }) {
  const hoy = hoyHN(), y = hoy.getFullYear();
  const PRES = {

    anio: [`Año ${y}`, `${y}-01-01`, `${y}-12-31`],

    todo: ['Todo', '', ''],
  };

  try { st = { ...st, ...(JSON.parse(sessionStorage.getItem(clave)) || {}) }; } catch (_) { }
  const fp = c => String(c.periodo?.fecha_pago || c.periodo?.fecha_fin || '').slice(0, 10);
  comps = [...comps].sort((x, y) => fp(y).localeCompare(fp(x)));

      <div class="segm" data-tipo><button type="button" data-f="">Todos</button><button type="button" data-f="salario">Salario</button><button type="button" data-f="comisiones">Comisiones</button></div>
      <select class="inp" data-pre style="width:auto">${Object.entries(PRES).map(([k, [t]]) => `<option value="${k}">${t}</option>`).join('')}<option value="otro">Elegir fechas…</option></select>
      <div class="fechas"><label class="f">Desde<input class="inp" type="date" data-desde></label><label class="f">Hasta<input class="inp" type="date" data-hasta></label></div>
    </div><div data-res></div><div data-lista></div>`;
  const $t = $('[data-tipo]', cont), $p = $('[data-pre]', cont), $d = $('[data-desde]', cont), $h = $('[data-hasta]', cont);
  const pintar = () => {
    try { sessionStorage.setItem(clave, JSON.stringify(st)); } catch (_) { }

    $p.value = st.pre; $d.value = st.desde || ''; $h.value = st.hasta || '';
